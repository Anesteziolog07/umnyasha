<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>Выбор заставки</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"><style>#boot{position:fixed;inset:0;z-index:1000;overflow:hidden;background:linear-gradient(180deg,#46B9FF 0%,#8EDCFF 38%,#D8F7FF 66%);transition:opacity .6s ease,transform .6s ease;cursor:pointer}
#boot.out{opacity:0;transform:scale(1.06);pointer-events:none}
.bt-glow{position:absolute;right:-22vmin;top:-22vmin;width:90vmin;height:90vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,240,170,.85),rgba(255,240,170,0) 68%)}
.bt-sun{position:absolute;right:5%;top:4%;width:clamp(88px,22vmin,170px);aspect-ratio:1;animation:bt-in 1s ease both}
.bt-sun svg{display:block;width:100%;height:100%;overflow:visible}
.bt-rays{transform-box:view-box;transform-origin:60px 60px;animation:bt-spin 14s linear infinite}
.bt-sky{position:absolute;left:0;display:flex;width:max-content;will-change:transform}
.bt-sky svg{display:block;flex:none;height:auto}
.bt-sky1{top:9%;gap:62vw;animation:bt-sky 34s linear infinite}.bt-sky1 svg{width:clamp(120px,30vmin,240px)}
.bt-sky2{top:30%;gap:30vw;opacity:.82;animation:bt-sky 22s linear infinite}.bt-sky2 svg{width:clamp(70px,17vmin,140px)}
.bt-air{position:absolute;left:7%;top:33%;width:clamp(44px,11vmin,92px);animation:bt-floatb 4s ease-in-out infinite}
.bt-air svg{display:block;width:100%;height:auto}
.bt-plane{position:absolute;left:-16%;top:46%;width:clamp(46px,11vmin,90px);animation:bt-planef 4.6s linear .3s both}
.bt-bal{position:absolute;bottom:-16%;width:clamp(44px,10vmin,84px);animation:bt-rise 5.4s ease-in var(--d) both}
.bt-strip{position:absolute;left:0;display:flex;width:max-content;will-change:transform;animation:bt-roll3 var(--s) linear infinite}
.bt-strip svg{display:block;flex:none;height:100%;width:calc(var(--h) * var(--k));overflow:visible}
.bt-far{--h:30vh;--k:6.15;--s:70s;bottom:30%;height:var(--h)}
.bt-mid2{--h:30vh;--k:5.33;--s:34s;bottom:23%;height:var(--h)}
.bt-near{--h:21vh;--k:6.15;--s:15s;bottom:22%;height:var(--h)}
.bt-fg{--h:16vh;--k:10.67;--s:7s;bottom:-1%;height:var(--h)}
.bt-ground{position:absolute;left:0;right:0;bottom:0;height:23%;background:linear-gradient(180deg,#5ACB62,#3DAF55)}
.bt-rail{position:absolute;left:-60px;right:-60px;bottom:21.5%;height:17px;overflow:hidden}
.bt-rail::before{content:'';position:absolute;left:0;right:0;top:0;height:6px;border-radius:3px;background:linear-gradient(180deg,#D9E2EE,#7F8CA3);z-index:1}
.bt-rail i{position:absolute;left:0;right:0;top:4px;bottom:0;background:repeating-linear-gradient(90deg,#9A6236 0 15px,transparent 15px 42px);animation:bt-ties .34s linear infinite}
.bt-train{--tw:min(94vw,136vh,760px);position:absolute;left:50%;bottom:calc(21.5% + 16px - var(--tw) * .0155);width:var(--tw);margin-left:calc(var(--tw) / -2);display:flex;align-items:flex-end;animation:bt-enter 1.5s cubic-bezier(.18,.7,.25,1) both}
.bt-eng{position:relative;flex:0 0 32%;z-index:2;animation:bt-shake .34s ease-in-out infinite}
.bt-eng svg{display:block;width:100%;height:auto;overflow:visible}
.bt-eng .um-wheel{animation:bt-wheel .62s linear infinite}
.bt-eng i{position:absolute;left:21%;top:0;width:15%;aspect-ratio:1;border-radius:50%;background:#FFFFFF;opacity:0;animation:bt-puff 1.5s ease-out infinite}
.bt-eng i:nth-child(2){animation-delay:.37s}.bt-eng i:nth-child(3){animation-delay:.75s}.bt-eng i:nth-child(4){animation-delay:1.12s}
.bt-car{position:relative;flex:1 1 0;margin-left:-1px;margin-bottom:calc(var(--tw) * .0155);aspect-ratio:120/84;animation:bt-shake .34s ease-in-out infinite}
.bt-car:nth-child(3){animation-delay:-.11s}.bt-car:nth-child(4){animation-delay:-.22s}
.bt-car svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bt-car img{position:absolute;left:21%;top:-40%;width:58%}
.bt-car .bt-w{transform-box:fill-box;transform-origin:center;animation:bt-wheel .62s linear infinite}
.bt-slot{position:absolute;top:8%;width:30%;height:10%}.bt-slot:nth-of-type(1){left:14%}.bt-slot:nth-of-type(2){right:14%}
.bt-mid{position:absolute;left:0;right:0;top:16%;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:5}
.bt-name{display:flex;font-size:clamp(50px,15vmin,120px);font-weight:900;line-height:1.05}
.bt-lx{display:inline-block;animation:bt-lx .8s linear calc(1.45s + var(--i) * .15s) both}
.bt-ly{display:inline-block;-webkit-text-stroke:8px #FFFFFF;paint-order:stroke fill;text-shadow:0 7px 0 rgba(20,50,120,.28);animation:bt-ly .8s cubic-bezier(.25,.75,.4,1) calc(1.45s + var(--i) * .15s) both,bt-wave 2.2s ease-in-out calc(3s + var(--i) * .1s) infinite}
.bt-sub{padding:5px 18px;border-radius:999px;background:rgba(255,255,255,.88);font-size:clamp(17px,4.6vmin,28px);font-weight:900;color:#1E4E8C;animation:bt-up .55s cubic-bezier(.2,.9,.3,1.3) 2.75s both}
.bt-conf{position:absolute;inset:0;z-index:4;pointer-events:none}
.bt-conf i{position:absolute;top:-4%;width:11px;height:15px;border-radius:3px;animation:bt-conf var(--t) linear var(--d) both}
@keyframes bt-enter{from{transform:translateX(112vw)}to{transform:none}}
@keyframes bt-roll3{from{transform:translateX(calc(var(--h) * var(--k) * -1))}to{transform:none}}
@keyframes bt-sky{from{transform:translateX(-50%)}to{transform:none}}
@keyframes bt-ties{from{transform:translateX(-42px)}to{transform:none}}
@keyframes bt-wheel{to{transform:rotate(-360deg)}}
@keyframes bt-shake{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5%)}}
@keyframes bt-puff{0%{transform:translate(0,0) scale(.45);opacity:.95}100%{transform:translate(240%,-300%) scale(2.6);opacity:0}}
@keyframes bt-lx{from{transform:translateX(var(--dx,0))}to{transform:none}}
@keyframes bt-ly{0%{transform:translateY(var(--dy,50vh)) scale(.34);opacity:0}10%{opacity:1}62%{transform:translateY(-20px) scale(1.14)}82%{transform:translateY(5px) scale(1.04,.94)}100%{transform:none;opacity:1}}
@keyframes bt-wave{0%,100%{translate:0 0}14%{translate:0 -9%}28%{translate:0 0}}
@keyframes bt-up{from{opacity:0;transform:translateY(14px) scale(.8)}to{opacity:1;transform:none}}
@keyframes bt-conf{0%{transform:translateY(0) rotate(0);opacity:1}85%{opacity:1}100%{transform:translateY(106vh) rotate(var(--r));opacity:0}}
@keyframes bt-floatb{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes bt-planef{from{transform:translate(0,0)}to{transform:translate(130vw,-40vh)}}
@keyframes bt-rise{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-125vh) rotate(6deg)}}
@keyframes bt-in{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes bt-spin{to{transform:rotate(360deg)}}
.bt-sail{animation:bt-spin 5s linear infinite}
@media (max-aspect-ratio: 1/1){.bt-mid{top:21%}.bt-train{--tw:96vw}}
@media (prefers-reduced-motion: reduce){#boot *{animation-duration:.01s!important;animation-iteration-count:1!important;animation-delay:0s!important}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Nunito,system-ui,-apple-system,'Segoe UI',sans-serif;color:#1E2A4A;background:linear-gradient(180deg,#BFE2FF,#F1F8FF 60%,#FFF6EA)}
#list{max-width:760px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:12px}
#list h1{margin:4px 0 0;font-size:32px;font-weight:900;line-height:1.1}
#list p{margin:0;font-size:17px;font-weight:700;color:#4A5578}
.card{display:flex;align-items:center;gap:14px;width:100%;min-height:96px;padding:12px 14px;border:0;border-radius:24px;background:#FFFFFF;color:#1E2A4A;cursor:pointer;text-align:left;box-shadow:0 12px 24px -18px rgba(43,84,160,.55);font-family:inherit}
.card img{flex:none;width:68px;height:68px;object-fit:contain}
.card span{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.card b{font-size:21px;font-weight:900;line-height:1.15}
.card em{font-style:normal;font-size:15px;font-weight:700;color:#4A5578;line-height:1.25}
.card i{flex:none;width:56px;height:56px;border-radius:50%;background:#2563EB;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px;box-shadow:inset 0 -4px 0 #1A47B0}
#pl{position:fixed;inset:0;z-index:999;display:none;background:#000}
#pl.on{display:block}
#boot{cursor:default}
#x{position:absolute;z-index:1002;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));width:48px;height:48px;border:0;border-radius:50%;background:rgba(255,255,255,.88);color:#1E2A4A;font-size:28px;font-weight:900;line-height:1;cursor:pointer}
#bar{position:absolute;z-index:1002;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:none;justify-content:center;gap:10px;padding:0 16px}
#bar.on{display:flex}
#bar button{min-height:56px;padding:0 22px;border:0;border-radius:999px;background:#FFC21A;color:#1E2A4A;font:inherit;font-size:18px;font-weight:900;cursor:pointer;box-shadow:inset 0 -5px 0 #E09A00}
#bar #next{background:#FFFFFF;box-shadow:inset 0 -5px 0 #DCE4F4}
#load{position:absolute;z-index:1003;inset:0;display:none;align-items:center;justify-content:center;background:#46B9FF;color:#FFFFFF;font-size:24px;font-weight:900}
#load.on{display:flex}
/* 2: шарики */
.v2t .bt-name{gap:0;align-items:flex-start}
.v2t .bt-lx{animation:bt-lx 1.7s cubic-bezier(.3,.1,.3,1) calc(1.5s + var(--i) * .17s) both}
.v2t .bt-ly{position:relative;display:block;width:clamp(74px,21vmin,150px);margin:0 clamp(-22px,-3.2vmin,-10px);-webkit-text-stroke:0;text-shadow:none;animation:v2up 1.7s cubic-bezier(.2,.75,.3,1) calc(1.5s + var(--i) * .17s) both,v2bob 2.4s ease-in-out calc(3.3s + var(--i) * .2s) infinite}
.v2t img{display:block;width:100%;height:auto}
.v2t b{position:absolute;left:0;right:0;top:12%;text-align:center;font-size:clamp(30px,9.4vmin,68px);font-weight:900;color:#FFFFFF;text-shadow:0 3px 0 rgba(20,20,60,.32)}
.v2t .bt-sub{animation-delay:3.7s}
@keyframes v2up{0%{transform:translateY(var(--dy,50vh)) scale(.25);opacity:0}8%{opacity:1}100%{transform:none;opacity:1}}
@keyframes v2bob{0%,100%{translate:0 0;rotate:-2deg}50%{translate:0 -7px;rotate:2deg}}
/* 3: лес */
.v3-l,.v3-r{position:absolute;top:0;bottom:0;width:53%;z-index:10;animation:v3a 1.9s cubic-bezier(.6,.02,.25,1) 1s both}
.v3-l{left:0;--o:-125vw}.v3-r{right:0;--o:125vw}
.v3-l svg,.v3-r svg{display:block;width:100%;height:100%}
.v3-glow{position:absolute;left:50%;top:0;bottom:0;width:16vw;margin-left:-8vw;z-index:9;background:linear-gradient(90deg,rgba(255,240,170,0),rgba(255,243,176,.75) 50%,rgba(255,240,170,0));animation:v3g 1.8s ease 1s both}
.v3-leaf{position:absolute;inset:0;z-index:11;pointer-events:none}
.v3-leaf i{position:absolute;width:15px;height:24px;border-radius:0 100% 0 100%;opacity:0;animation:v3f 1.8s ease-out var(--d) both}
.v3-rays{position:absolute;left:50%;top:27%;width:190vmax;height:190vmax;margin:-95vmax 0 0 -95vmax;z-index:4;background:repeating-conic-gradient(rgba(255,255,255,.2) 0 11deg,transparent 11deg 24deg);border-radius:50%;animation:bt-spin 24s linear infinite,v3r 1.5s ease 2s both}
.v3-rays~.bt-conf{z-index:5}
#boot.v3 .bt-mid{z-index:6}
#boot.v3 .bt-lx{animation:none}
#boot.v3 .bt-ly,#boot.v4 .bt-ly,#boot.v6 .bt-ly{--dy:0px;animation:vpop .62s cubic-bezier(.3,1.6,.5,1) calc(var(--t0) + var(--i) * .12s) both,bt-wave 2.2s ease-in-out calc(var(--t0) + 1.4s + var(--i) * .1s) infinite}
#boot.v3{--t0:2.2s}#boot.v4{--t0:3.2s}#boot.v6{--t0:3.9s}
#boot.v3 .bt-sub{animation-delay:3.1s}#boot.v4 .bt-sub{animation-delay:4.1s}#boot.v6 .bt-sub{animation-delay:4.8s}
#boot.v4 .bt-lx,#boot.v6 .bt-lx{animation:none}
@keyframes vpop{0%{transform:scale(0) rotate(-14deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes v3a{to{transform:translateX(var(--o))}}
@keyframes v3g{0%{opacity:1;transform:scaleX(.5)}60%{opacity:1;transform:scaleX(3)}100%{opacity:0;transform:scaleX(5)}}
@keyframes v3f{0%{opacity:0;transform:translate(0,0) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
@keyframes v3r{from{opacity:0}to{opacity:1}}
/* 4: книжка */
#boot.v4{background:linear-gradient(180deg,#FFE3B8,#FFD09A 60%,#F2B677)}
.v4-table{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,#C98B55,#A9713F)}
.v4-book{--bw:min(94vw,118vh,900px);--bh:calc(var(--bw) * .56);position:absolute;left:50%;top:58%;width:var(--bw);height:var(--bh);margin:calc(var(--bh) / -2) 0 0 calc(var(--bw) / -2);perspective:1600px;animation:v4s 1.2s cubic-bezier(.4,.1,.2,1) .7s both}
.v4-spread{position:absolute;inset:0;overflow:hidden;border-radius:14px;background:#FFFDF4;box-shadow:0 0 0 7px #E7584F,0 16px 26px -10px rgba(90,40,10,.55);animation:v4w 1.2s ease .7s both}
.v4-spread::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:26px;margin-left:-13px;background:linear-gradient(90deg,rgba(90,60,30,0),rgba(90,60,30,.22),rgba(90,60,30,0))}
.v4-sky{position:absolute;inset:0;background:linear-gradient(180deg,#7CD0FF,#D8F7FF)}
.v4-p{position:absolute;left:0;bottom:0;width:100%;height:100%;overflow:visible;transform-origin:50% 100%;animation:v4u .55s cubic-bezier(.3,1.5,.5,1) var(--d) both}
.p0{--d:1.8s}.p1{--d:1.95s}.p2{--d:2.2s}.p3{--d:2.45s}.p4{--d:2.7s}
#boot.v4 .bt-train{--tw:calc(var(--bw) * .74);bottom:calc(var(--bw) * .018);animation:bt-enter 1.3s cubic-bezier(.18,.7,.25,1) 2.9s both;z-index:4}
#boot.v4 .bt-eng,#boot.v4 .bt-car{animation:none}
#boot.v4 .um-wheel,#boot.v4 .bt-w{animation:bt-wheel .62s linear 2.9s 2}
@media (max-aspect-ratio: 1/1){.v4-book{--bh:calc(var(--bw) * .78)}}
.v4-cover{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:0 50%;transform-style:preserve-3d;animation:v4o 1.2s cubic-bezier(.45,.05,.3,1) .7s both,v4h .25s linear 1.85s both;z-index:3}
.v4-front,.v4-back{position:absolute;inset:-7px -7px -7px 0;border-radius:0 14px 14px 0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.v4-front{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(160deg,#F2645B,#D13F3A);box-shadow:inset 8px 0 10px -6px rgba(0,0,0,.3)}
.v4-front img{width:34%;animation:bt-floatb 2s ease-in-out infinite}
.v4-ctitle{font-size:clamp(26px,7.4vmin,62px);font-weight:900;color:#FFE27A;text-shadow:0 3px 0 rgba(90,20,10,.4)}
.v4-csub{font-size:clamp(13px,3vmin,22px);font-weight:800;color:#FFFFFF}
.v4-back{transform:rotateY(180deg);background:#D13F3A;border-radius:14px 0 0 14px}
.v4t .bt-mid{top:9%}
#boot.v4 .v4t .bt-name{font-size:clamp(46px,13vmin,100px)}
@keyframes v4s{from{transform:translateX(-25%) scale(.86)}to{transform:none}}
@keyframes v4w{from{clip-path:inset(-20px -20px -30px 50%)}to{clip-path:inset(-20px -20px -30px -20px)}}
@keyframes v4o{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
@keyframes v4u{from{transform:scaleY(0)}to{transform:none}}
@keyframes v4h{to{opacity:0}}
/* 5: рассвет */
#boot.v5{background:linear-gradient(180deg,#141C52,#35397F 55%,#7C5A9E)}
.v5-day{position:absolute;inset:0;background:linear-gradient(180deg,#46B9FF,#8EDCFF 38%,#D8F7FF 66%);opacity:0;animation:v5d 2.4s ease .6s both}
.v5-stars{position:absolute;inset:0;animation:v5o 1.6s ease .7s both}
.v5-stars i{position:absolute;width:4px;height:4px;border-radius:50%;background:#FFFFFF;animation:v5t 1.1s ease-in-out var(--d) infinite alternate}
.v5-sunw{position:absolute;inset:0;animation:v5s 2.6s cubic-bezier(.2,.7,.3,1) .4s both}
.v5-dark{position:absolute;inset:0;background:rgba(20,26,90,.62);animation:v5o 2.4s ease .6s both;pointer-events:none}
#boot.v5 .bt-strip{animation-duration:calc(var(--s) * 3)}
#boot.v5 .bt-train{animation:v5tr 1.8s cubic-bezier(.18,.7,.25,1) 3.6s both}
#boot.v5 .bt-fg{z-index:5}
.v5-row{position:absolute;left:50%;bottom:21.5%;top:0;width:min(94vw,132vh,860px);margin-left:calc(min(94vw,132vh,860px) / -2);display:flex;justify-content:space-between}
.v5-f{position:relative;flex:1 1 0}
.v5-st{position:absolute;left:50%;bottom:0;width:7px;margin-left:-3.5px;height:var(--h);border-radius:4px;background:linear-gradient(180deg,#39BE78,#238F58);transform-origin:50% 100%;animation:v5g .9s ease-out calc(2.4s + var(--i) * .2s) both}
.v5-lf{position:absolute;left:50%;bottom:calc(var(--h) * .45);width:26px;height:13px;border-radius:0 100% 0 100%;background:#39BE78;transform-origin:0 100%;animation:vpop .5s ease calc(2.8s + var(--i) * .2s) both}
.v5-hd{position:absolute;left:50%;bottom:var(--h);width:clamp(52px,16vmin,118px);aspect-ratio:1;margin-left:calc(clamp(52px,16vmin,118px) / -2);margin-bottom:-10px;animation:vpop .6s cubic-bezier(.3,1.6,.5,1) calc(2.9s + var(--i) * .2s) both}
.v5-hd svg{display:block;width:100%;height:100%}
.v5-hd b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(25px,8vmin,60px);font-weight:900;color:#1E2A4A}
.v5t{top:auto;bottom:47%;z-index:6}
#boot.v5 .v5t{top:9%;bottom:auto}
#boot.v5 .bt-sub{animation-delay:4.2s}
@keyframes v5d{to{opacity:1}}
@keyframes v5o{to{opacity:0}}
@keyframes v5t{from{opacity:.25}to{opacity:1}}
@keyframes v5s{from{transform:translateY(70vh)}to{transform:none}}
@keyframes v5g{from{transform:scaleY(0)}to{transform:none}}
@keyframes v5tr{from{transform:translateX(112vw)}to{transform:none}}
/* 6: карандаш */
#boot.v6{background:#FFFDF6}
.v6-paper{position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 33px,rgba(120,170,230,.28) 33px 35px)}
.v6-art{position:absolute;inset:0;width:100%;height:100%}
.v6-art path{stroke-dasharray:1;stroke-dashoffset:1;animation:v6d var(--t) linear var(--d) both}
.v6-pen{position:absolute;left:0;top:0;width:clamp(70px,20vmin,150px);z-index:3;transform-origin:0 100%;animation:v6p 3.3s ease-in-out both,v6h .4s ease 3.25s both}
.v6-col{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,#46B9FF 0%,#8EDCFF 38%,#D8F7FF 66%);clip-path:circle(0 at 50% 62%);animation:v6c 1.4s cubic-bezier(.5,0,.2,1) 3.3s both}
#boot.v6 .v6-col .bt-train{animation:none}
@keyframes v6d{to{stroke-dashoffset:0}}
@keyframes v6p{0%{transform:translate(72vw,14vh)}14%{transform:translate(62vw,24vh)}24%{transform:translate(20vw,20vh)}36%{transform:translate(10vw,48vh)}50%{transform:translate(82vw,44vh)}64%{transform:translate(30vw,46vh)}78%{transform:translate(8vw,62vh)}90%{transform:translate(40vw,56vh)}100%{transform:translate(60vw,58vh)}}
@keyframes v6h{to{opacity:0}}
