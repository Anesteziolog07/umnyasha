<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>Звук паровозика</title>
<style>
:root{--ink:#1E2A4A;--sub:#4A5578}
*{box-sizing:border-box}
body{margin:0;padding:16px 16px 40px;background:linear-gradient(180deg,#BFE2FF,#F1F8FF 60%,#FFF6EA);min-height:100vh;color:var(--ink);font-family:Nunito,system-ui,-apple-system,'Segoe UI',sans-serif}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{margin:6px 0 0;font-size:32px;font-weight:900;line-height:1.1}
.lead{margin:0;font-size:17px;font-weight:700;color:var(--sub)}
.now{position:sticky;top:8px;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 16px;border-radius:20px;background:#1E2A4A;color:#fff;font-size:16px;font-weight:800}
.now a,.now button{flex:none;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:0;border-radius:999px;background:#FFC21A;color:var(--ink);font:inherit;font-weight:900;text-decoration:none;cursor:pointer}
.now button{background:#fff}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:24px;background:#fff;box-shadow:0 12px 24px -18px rgba(43,84,160,.5);border:3px solid transparent}
.row.on{border-color:#2FBF71}
.play{flex:none;width:64px;height:64px;border:0;border-radius:50%;background:#2563EB;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -5px 0 #1A47B0}
.play.go{background:#D63A74;box-shadow:inset 0 -5px 0 #A32355}
.t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.t b{font-size:19px;font-weight:900;line-height:1.15}
.t span{font-size:15px;font-weight:700;color:var(--sub)}
.pick{flex:none;min-height:48px;min-width:64px;padding:0 12px;border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);font:inherit;font-size:15px;font-weight:900;cursor:pointer}
.row.on .pick{border-color:#2FBF71;background:#2FBF71;color:#fff}
.err{position:sticky;top:76px;z-index:2;margin:0;padding:10px 14px;border-radius:14px;background:#FEECEB;color:#A11A12;font-size:15px;font-weight:800}
[hidden]{display:none!important}
</style></head><body><main>
<h1>Звук паровозика</h1>
<p class="lead">Нажми круглую кнопку, чтобы послушать. Понравился звук — нажми «В игру» и проверь его в «Паровозике». Потом напиши номер в чат с Claude.</p>
<div class="now" id="now" hidden><span id="nowT"></span><a href="./">Открыть игру</a><button type="button" id="back">Как было</button></div>
<p class="err" id="err" hidden>Этот звук не загрузился. Попробуй ещё раз.</p>
<div id="list" style="display:flex;flex-direction:column;gap:10px"></div>
</main><script>
var V=[{"n": 1, "t": "Настоящий паровоз", "d": "Гудки, потом поезд трогается", "g": 0.74}, {"n": 2, "t": "Паровоз разгоняется", "d": "Короткий гудок и нарастающий ход", "g": 0.79}, {"n": 3, "t": "Паровоз ровно идёт", "d": "Без долгого гудка, сразу ход", "g": 1.0}, {"n": 4, "t": "Мягкое «чух-чух»", "d": "Только пар, без гудка", "g": 1.26}, {"n": 5, "t": "Бодрое «чух-чух»", "d": "Быстрый ровный ход", "g": 0.71}, {"n": 6, "t": "Долгий гудок", "d": "Один тёплый протяжный гудок", "g": 0.43}, {"n": 7, "t": "Игрушечный свисток", "d": "Маленький жестяной поезд", "g": 0.64}, {"n": 8, "t": "Деревянный поезд", "d": "Колёсики по деревянным рельсам", "g": 0.42}, {"n": 9, "t": "Мультяшный", "d": "Лёгкий и весёлый", "g": 0.79}, {"n": 10, "t": "Стук колёс", "d": "«Тук-тук» по рельсам", "g": 1.55}, {"n": 11, "t": "Тепловоз", "d": "Два гудка, потом отъезжает", "g": 0.52}, {"n": 12, "t": "Голос Луни", "d": "«Ту-ту! Чух-чух-чух!»", "g": 1.0}],KEY='umnyasha.trainsfx',ac,src,cur=0,bufs={},tok=0;
var IC_PLAY='<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>',IC_STOP='<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>';
function saved(){try{var p=JSON.parse(localStorage.getItem(KEY)||'null');return p&&p.n?p:null}catch(e){return null}}
function show(){var p=saved();document.getElementById('now').hidden=!p;if(p){var v=V.filter(function(x){return x.n===p.n})[0];document.getElementById('nowT').textContent='В игре: '+p.n+'. '+(v?v.t:'')}
 V.forEach(function(v){var r=document.getElementById('r'+v.n),on=!!p&&p.n===v.n;r.classList.toggle('on',on);var b=r.querySelector('.pick');b.textContent=on?'Выбран':'В игру';b.setAttribute('aria-pressed',on?'true':'false');
 var q=r.querySelector('.play');q.classList.toggle('go',cur===v.n);q.innerHTML=cur===v.n?IC_STOP:IC_PLAY;q.setAttribute('aria-label',(cur===v.n?'Остановить ':'Послушать ')+v.n)})}
function stop(){tok++;if(src){try{src.onended=null;src.stop()}catch(e){}src=null}cur=0}
function play(v){var was=cur===v.n;stop();show();if(was)return;var C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=ac||new C();if(ac.state!=='running')ac.resume();document.getElementById('err').hidden=true;cur=v.n;show();var my=tok;
 (bufs[v.n]||(bufs[v.n]=fetch('zvuki-poezda/'+v.n+'.mp3').then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()}).then(function(d){return new Promise(function(a,b){ac.decodeAudioData(d,a,b)})}))).then(function(b){if(my!==tok)return;
 var s=ac.createBufferSource(),g=ac.createGain(),t=ac.currentTime,end=t+Math.min(b.duration,3.1);g.gain.setValueAtTime(v.g,t);g.gain.setValueAtTime(v.g,end-.35);g.gain.linearRampToValueAtTime(0,end);s.buffer=b;s.connect(g);g.connect(ac.destination);s.onended=function(){if(src===s){src=null;cur=0;show()}};s.start(t);s.stop(end+.02);src=s}).catch(function(){delete bufs[v.n];cur=0;document.getElementById('err').hidden=false;show()})}
V.forEach(function(v){var r=document.createElement('div');r.className='row';r.id='r'+v.n;r.innerHTML='<button type="button" class="play"></button><div class="t"><b>'+v.n+'. '+v.t+'</b><span>'+v.d+'</span></div><button type="button" class="pick"></button>';
 r.querySelector('.play').onclick=function(){play(v)};r.querySelector('.pick').onclick=function(){try{localStorage.setItem(KEY,JSON.stringify({n:v.n,g:v.g}))}catch(e){}show()};document.getElementById('list').appendChild(r)});
document.getElementById('back').onclick=function(){try{localStorage.removeItem(KEY)}catch(e){}show()};show();
</script></body></html>
