<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Умняша — развивающие игры</title>
<meta name="description" content="Развивающие игры для детей 3–9 лет: внимание, счёт, логика, память и первые буквы. Без рекламы и покупок.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#BFE2FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Умняша">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0;background:#D6ECFF;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:#1E2A4A}
a{color:#2557D6}a:hover{color:#1A3FA0}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid #1E2A4A;outline-offset:3px}
button:disabled{cursor:default}
.press{transition:transform .12s ease,box-shadow .12s ease}
.press:hover:not(:disabled){transform:translateY(-2px)}
.press:active:not(:disabled){transform:translateY(1px) scale(.98)}
.shake{animation:um-shake .42s ease}
.pop{animation:um-pop .45s ease}
.flip{animation:um-flip .28s ease}
.bob{animation:um-bob 1s ease-in-out infinite}
.bob2{animation:um-bob 1s ease-in-out .15s infinite}
.bob3{animation:um-bob 1s ease-in-out .3s infinite}
.rise{animation:um-rise .5s ease both}
@keyframes um-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes um-pop{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes um-flip{0%{transform:scaleX(.2)}100%{transform:scaleX(1)}}
@keyframes um-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes um-rise{0%{opacity:0;transform:translateY(12px) scale(.9)}100%{opacity:1;transform:none}}
.pulse{animation:um-pulse 1.6s ease-in-out infinite}
@keyframes um-pulse{0%,100%{box-shadow:0 0 0 0 rgba(30,42,74,.22)}50%{box-shadow:0 0 0 7px rgba(30,42,74,0)}}
.um-lvgrid{grid-template-columns:repeat(10,minmax(0,1fr))}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width: 640px){
.um-head{padding:12px 16px!important;gap:10px!important}
.um-nav{order:3;width:100%;flex-wrap:nowrap!important;gap:6px!important}
.um-nav button{flex:1 1 auto;white-space:nowrap;padding:0 8px!important;font-size:14px!important}
.um-logo-text{font-size:20px!important}
.um-logo-shapes span{width:15px!important;height:15px!important}
.um-tools{gap:6px!important}
.um-tools button,.um-tools > span{padding:0 10px!important;font-size:15px!important;gap:5px!important}
.um-hero{padding:20px!important}
.um-h1{font-size:32px!important}
.um-gbar{gap:8px!important}
.um-gbar-title{order:3;flex-basis:100%!important}
.um-lv{padding:18px 14px!important;border-radius:26px!important}
.um-lvgrid{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:8px!important}
.um-lvcta{width:100%}
.um-diff button{padding:8px 4px!important}
.um-diff .um-diff-name{font-size:16px!important}
.um-pages button{font-size:14px!important;padding:0 2px!important}
}
.um-nav.um-hide{display:none!important}
/* обложка и появление игр; fill-mode backwards — после анимации работают обычные эффекты наведения */
.um-intro-in{animation:um-introin .7s cubic-bezier(.2,.9,.3,1.15) backwards}
.um-intro-in2{animation:um-introin2 .8s cubic-bezier(.2,.9,.3,1.15) .35s backwards}
@keyframes um-introin{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
@keyframes um-introin2{from{opacity:0;transform:translateX(40px) rotate(2deg)}to{opacity:1;transform:none}}
.um-word{display:inline-block;animation:um-wordin .6s cubic-bezier(.2,1.4,.4,1) backwards}
@keyframes um-wordin{from{opacity:0;transform:translateY(20px) rotate(-5deg) scale(.9)}to{opacity:1;transform:none}}
.um-wave{display:inline-block;animation:um-wave 1.9s ease-in-out infinite}
@keyframes um-wave{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px)}60%{transform:translateY(-12px)}}
.um-ggrid > *{animation:um-cardin .55s cubic-bezier(.2,.9,.3,1.15) backwards}
.um-ggrid > *:nth-child(2){animation-delay:.06s}.um-ggrid > *:nth-child(3){animation-delay:.12s}.um-ggrid > *:nth-child(4){animation-delay:.18s}
.um-ggrid > *:nth-child(5){animation-delay:.24s}.um-ggrid > *:nth-child(6){animation-delay:.3s}.um-ggrid > *:nth-child(7){animation-delay:.36s}.um-ggrid > *:nth-child(8){animation-delay:.42s}
@keyframes um-cardin{from{opacity:0;transform:translateY(28px) scale(.94)}to{opacity:1;transform:none}}
/* сетка игр: 4 в ряд, на планшете 2, на узком телефоне 1 */
@media (max-width: 1000px){.um-ggrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media (max-width: 460px){.um-ggrid{grid-template-columns:minmax(0,1fr)!important}}
.um-gscene{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.um-gcard{transition:transform .18s ease,box-shadow .25s ease}
.um-gcard:hover{box-shadow:0 1px 0 rgba(30,42,74,.04),0 26px 50px -16px rgba(43,84,160,.42)!important}
.um-gcard:hover .um-gscene{transform:scale(1.06)}
/* предметы в играх: мягко покачиваются */
.um-item{display:inline-block;flex:none;animation:um-ibob 2.8s ease-in-out infinite;filter:drop-shadow(0 5px 6px rgba(60,90,150,.2))}
.um-item.um-isway{animation:um-isway 3.2s ease-in-out infinite;transform-origin:50% 90%}
.um-item.um-ibreathe{animation:um-ibreathe 2.6s ease-in-out infinite}
@keyframes um-isway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes um-ibreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07) translateY(-2px)}}
@keyframes um-ibob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-4deg)}}
/* предметы на фоне */
.um-pk{position:absolute;display:block}
.um-dm{display:block;width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(40,80,150,.18))}
.um-dfloat{animation:um-float 8s ease-in-out infinite}
.um-dspin{animation:um-dspin 20s linear infinite}
@keyframes um-dspin{to{transform:rotate(360deg)}}
.um-drise{animation:um-drise 9s ease-in-out infinite}
@keyframes um-drise{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-26px) rotate(4deg)}}
.um-dsway{transform-origin:50% 100%;animation:um-dsway 5s ease-in-out infinite;filter:none}
@keyframes um-dsway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.um-pop-a{animation:um-pop-a .8s cubic-bezier(.2,1.5,.4,1) both}
.um-pop-b{animation:um-pop-b .8s cubic-bezier(.2,1.5,.4,1) both}
@keyframes um-pop-a{from{transform:scale(0) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes um-pop-b{from{transform:scale(0) rotate(25deg);opacity:0}to{transform:none;opacity:1}}
@media (max-width: 640px){
/* на узком экране оставляем каждое второе растение — так они равномерно по всей ширине */
.um-plants .um-pk:nth-child(even){display:none}
.um-pk{width:52px!important;height:52px!important}
}
/* небо: облака, солнце, змей и фигурки; слой под всем содержимым */
.um-sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.um-sun{position:absolute;top:-90px;right:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#FFE48A 0 34%,rgba(255,228,138,.55) 35%,rgba(255,228,138,.2) 52%,rgba(255,228,138,0) 70%);animation:um-glow 7s ease-in-out infinite}
@keyframes um-glow{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.um-cloud{position:absolute;left:0;height:auto;animation:um-drift linear infinite;filter:drop-shadow(0 10px 18px rgba(80,130,200,.12))}
@keyframes um-drift{from{transform:translateX(-35vw)}to{transform:translateX(110vw)}}
.um-c1{top:7%;width:230px;animation-duration:100s;animation-delay:-18s}
.um-c2{top:22%;width:160px;animation-duration:130s;animation-delay:-80s;opacity:.92}
.um-c3{top:43%;width:270px;animation-duration:150s;animation-delay:-40s;opacity:.85}
.um-c4{top:61%;width:180px;animation-duration:115s;animation-delay:-95s;opacity:.85}
.um-c5{top:78%;width:240px;animation-duration:140s;animation-delay:-8s;opacity:.8}
.um-c6{top:13%;width:120px;animation-duration:90s;animation-delay:-58s;opacity:.95}
.um-fl{position:absolute;display:block;opacity:.75;animation:um-float 9s ease-in-out infinite}
@keyframes um-float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-18px) rotate(14deg)}}
.um-f1{top:30%;right:4%;width:26px;height:26px}
.um-f2{top:56%;left:2.5%;width:18px;height:18px;animation-delay:-3s}
.um-f3{top:70%;right:3%;width:22px;height:22px;animation-delay:-5s}
.um-f4{top:40%;left:5%;width:16px;height:16px;animation-delay:-7s}
.um-f5{top:88%;right:8%;width:18px;height:18px;animation-delay:-2s}
.um-sky.um-calm .um-cloud{opacity:.45}
@media (prefers-reduced-motion: reduce){
.um-c1{left:6%}.um-c2{left:58%}.um-c3{left:24%}.um-c4{left:72%}.um-c5{left:4%}.um-c6{left:40%}
}
@media (max-width: 640px){
.um-cloud{transform-origin:0 0}
.um-c1{width:150px}.um-c2{width:110px}.um-c3{width:170px}.um-c4{width:120px}.um-c5{width:150px}.um-c6{width:90px}
.um-sun{width:200px;height:200px;top:-70px;right:-70px}
.um-fl{display:none}
}
/* шапка: белая «стеклянная» панель; на телефоне не прилипает, чтобы не занимать экран */
.um-head{position:sticky;top:10px;z-index:30}
@media (max-width: 1000px){.um-head{position:relative}}
@media (max-width: 640px){.um-head{position:static;margin:8px 8px 12px!important;width:auto!important}}
.um-chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;background:#F2F7FF;border:1.5px solid #D7E5FA;font-size:15px;font-weight:800;color:#1E2A4A}
.um-skill{transition:transform .2s ease}
.um-skill:hover{transform:translateY(-3px)}
@media (max-width: 900px){.um-agecard{max-width:none!important;margin-left:0!important}}
.um-input:focus{outline:3px solid #2557D6;outline-offset:1px;border-color:#2557D6!important}
input[type=checkbox]:focus-visible{outline:3px solid #2557D6;outline-offset:2px}
summary:focus-visible{outline:3px solid #2557D6;outline-offset:3px;border-radius:6px}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="position: relative; isolation: isolate; min-height: 100vh; background: linear-gradient(180deg, #BFE2FF 0%, #DCEFFF 28%, #F1F8FF 58%, #FFF6EA 100%); color: #1E2A4A; font-family: 'Nunito', system-ui, sans-serif">
<div class="{{skyCls}}" aria-hidden="true">
<span class="um-sun"></span>
<svg class="um-cloud um-c1" viewBox="0 0 200 100"><g fill="#DCEBFB"><circle cx="62" cy="64" r="30"></circle><circle cx="104" cy="50" r="38"></circle><circle cx="146" cy="66" r="28"></circle><rect x="34" y="62" width="140" height="32" rx="16"></rect></g><g fill="#FFFFFF"><circle cx="62" cy="58" r="30"></circle><circle cx="104" cy="44" r="38"></circle><circle cx="146" cy="60" r="28"></circle><rect x="34" y="56" width="140" height="32" rx="16"></rect></g></svg>
<svg class="um-cloud um-c2" viewBox="0 0 200 100"><g fill="#DCEBFB"><circle cx="58" cy="66" r="24"></circle><circle cx="90" cy="52" r="30"></circle><circle cx="128" cy="48" r="34"></circle><circle cx="160" cy="68" r="22"></circle><rect x="36" y="64" width="140" height="28" rx="14"></rect></g><g fill="#FFFFFF"><circle cx="58" cy="60" r="24"></circle><circle cx="90" cy="46" r="30"></circle><circle cx="128" cy="42" r="34"></circle><circle cx="160" cy="62" r="22"></circle><rect x="36" y="58" width="140" height="28" rx="14"></rect></g></svg>
<svg class="um-cloud um-c3" viewBox="0 0 200 100"><g fill="#DCEBFB"><circle cx="62" cy="64" r="30"></circle><circle cx="104" cy="50" r="38"></circle><circle cx="146" cy="66" r="28"></circle><rect x="34" y="62" width="140" height="32" rx="16"></rect></g><g fill="#FFFFFF"><circle cx="62" cy="58" r="30"></circle><circle cx="104" cy="44" r="38"></circle><circle cx="146" cy="60" r="28"></circle><rect x="34" y="56" width="140" height="32" rx="16"></rect></g></svg>
<svg class="um-cloud um-c4" viewBox="0 0 200 100"><g fill="#DCEBFB"><circle cx="58" cy="66" r="24"></circle><circle cx="90" cy="52" r="30"></circle><circle cx="128" cy="48" r="34"></circle><circle cx="160" cy="68" r="22"></circle><rect x="36" y="64" width="140" height="28" rx="14"></rect></g><g fill="#FFFFFF"><circle cx="58" cy="60" r="24"></circle><circle cx="90" cy="46" r="30"></circle><circle cx="128" cy="42" r="34"></circle><circle cx="160" cy="62" r="22"></circle><rect x="36" y="58" width="140" height="28" rx="14"></rect></g></svg>
<svg class="um-cloud um-c5" viewBox="0 0 200 100"><g fill="#DCEBFB"><circle cx="62" cy="64" r="30"></circle><circle cx="104" cy="50" r="38"></circle><circle cx="146" cy="66" r="28"></circle><rect x="34" y="62" width="140" height="32" rx="16"></rect></g><g fill="#FFFFFF"><circle cx="62" cy="58" r="30"></circle><circle cx="104" cy="44" r="38"></circle><circle cx="146" cy="60" r="28"></circle><rect x="34" y="56" width="140" height="32" rx="16"></rect></g></svg>
<svg class="um-cloud um-c6" viewBox="0 0 200 100"><g fill="#DCEBFB"><circle cx="58" cy="66" r="24"></circle><circle cx="90" cy="52" r="30"></circle><circle cx="128" cy="48" r="34"></circle><circle cx="160" cy="68" r="22"></circle><rect x="36" y="64" width="140" height="28" rx="14"></rect></g><g fill="#FFFFFF"><circle cx="58" cy="60" r="24"></circle><circle cx="90" cy="46" r="30"></circle><circle cx="128" cy="42" r="34"></circle><circle cx="160" cy="62" r="22"></circle><rect x="36" y="58" width="140" height="28" rx="14"></rect></g></svg>
<svg aria-hidden="true" width="0" height="0" style="position: absolute; width: 0; height: 0; overflow: hidden"><defs>
<radialGradient id="umg-red" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#FF9E94"></stop><stop offset="100%" stop-color="#E5393B"></stop></radialGradient>
<radialGradient id="umg-yellow" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#FFF7A8"></stop><stop offset="100%" stop-color="#FDB813"></stop></radialGradient>
<radialGradient id="umg-orange" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#FFD39A"></stop><stop offset="100%" stop-color="#FB8C00"></stop></radialGradient>
<radialGradient id="umg-green" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#A7F0BF"></stop><stop offset="100%" stop-color="#259A55"></stop></radialGradient>
<radialGradient id="umg-blue" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#A9DBFF"></stop><stop offset="100%" stop-color="#2F7DE1"></stop></radialGradient>
<radialGradient id="umg-pink" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#FFC6E5"></stop><stop offset="100%" stop-color="#EA4E9D"></stop></radialGradient>
<radialGradient id="umg-purple" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#DCC8FF"></stop><stop offset="100%" stop-color="#8B5CF6"></stop></radialGradient>
<radialGradient id="umg-melon" cx="50%" cy="10%" r="90%"><stop offset="0%" stop-color="#FF9A8F"></stop><stop offset="100%" stop-color="#EF3E3E"></stop></radialGradient>
<linearGradient id="umg-wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#C08A5A"></stop><stop offset="100%" stop-color="#8A5A33"></stop></linearGradient>
<linearGradient id="umc-red" x1="0.2" y1="0" x2="0.6" y2="1"><stop offset="0%" stop-color="#FFD3DB"></stop><stop offset="40%" stop-color="#FF7590"></stop><stop offset="100%" stop-color="#E8486A"></stop></linearGradient><linearGradient id="umc-blue" x1="0.2" y1="0" x2="0.6" y2="1"><stop offset="0%" stop-color="#D2E9FF"></stop><stop offset="40%" stop-color="#5DB0FF"></stop><stop offset="100%" stop-color="#2F80E8"></stop></linearGradient><linearGradient id="umc-yellow" x1="0.2" y1="0" x2="0.6" y2="1"><stop offset="0%" stop-color="#FFF4C2"></stop><stop offset="40%" stop-color="#FFD95E"></stop><stop offset="100%" stop-color="#F2AE1C"></stop></linearGradient><linearGradient id="umc-green" x1="0.2" y1="0" x2="0.6" y2="1"><stop offset="0%" stop-color="#D2F6E1"></stop><stop offset="40%" stop-color="#5FD898"></stop><stop offset="100%" stop-color="#27AE68"></stop></linearGradient><linearGradient id="umc-orange" x1="0.2" y1="0" x2="0.6" y2="1"><stop offset="0%" stop-color="#FFE5C8"></stop><stop offset="40%" stop-color="#FFAF5F"></stop><stop offset="100%" stop-color="#F5872B"></stop></linearGradient><linearGradient id="umc-purple" x1="0.2" y1="0" x2="0.6" y2="1"><stop offset="0%" stop-color="#ECDFFF"></stop><stop offset="40%" stop-color="#BA95FF"></stop><stop offset="100%" stop-color="#8C5BEE"></stop></linearGradient></defs></svg>
</div>


<sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}">
<div role="status" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px">
<div aria-hidden="true" style="display: flex; gap: 16px; align-items: flex-end">
<span class="bob" style="display: block; width: 44px; height: 44px; background: #EF4444; clip-path: circle(48% at 50% 50%)"></span>
<span class="bob2" style="display: block; width: 44px; height: 44px; background: #FACC15; clip-path: polygon(50% 5%, 97% 93%, 3% 93%)"></span>
<span class="bob3" style="display: block; width: 44px; height: 44px; background: #3B82F6; clip-path: inset(8% round 16%)"></span>
</div>
<p style="margin: 0; font-size: 24px; font-weight: 800">Загружаем игры…</p>
</div>
</sc-if>

<sc-if value="{{isReady}}" hint-placeholder-val="{{ true }}">
<header class="um-head" style="width: calc(100% - 32px); max-width: 1088px; margin: 12px auto 18px; padding: 10px 14px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; background: rgba(255,255,255,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 28px; border: 1.5px solid rgba(255,255,255,.95); box-shadow: 0 12px 32px -14px rgba(43,84,160,.4)">
<button type="button" class="press" onClick="{{goHome}}" aria-label="Умняша, на главную" style="display: flex; align-items: center; gap: 10px; background: transparent; border: 0; padding: 6px 4px; cursor: pointer; color: #1E2A4A">
<span class="um-logo-shapes" aria-hidden="true" style="display: flex; gap: 3px; align-items: center">
<span style="display: block; width: 22px; height: 22px; background: #EF4444; clip-path: circle(48% at 50% 50%)"></span>
<span style="display: block; width: 22px; height: 22px; background: #FACC15; clip-path: polygon(50% 5%, 97% 93%, 3% 93%)"></span>
<span style="display: block; width: 22px; height: 22px; background: #3B82F6; clip-path: inset(8% round 16%)"></span>
</span>
<span class="um-logo-text" style="font-size: 28px; font-weight: 900; letter-spacing: -0.01em">Умняша</span>
</button>
<nav class="um-nav {{navCls}}" aria-label="Разделы" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="3">
<button type="button" class="press" onClick="{{n.go}}" aria-current="{{n.current}}" style="min-height: 48px; padding: 0 18px; border-radius: 999px; border: 2px solid #1E2A4A; background: {{n.bg}}; color: {{n.fg}}; font-size: 17px; font-weight: 800; cursor: pointer">{{n.label}}</button>
</sc-for>
</nav>
<div class="um-tools" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<sc-if value="{{me.guest}}" hint-placeholder-val="{{ true }}">
<button type="button" class="press" onClick="{{me.login}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 999px; border: 2px solid #1E2A4A; background: #FFFFFF; color: #1E2A4A; font-size: 17px; font-weight: 800; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"></path><path d="M9 16l4-4-4-4"></path><path d="M13 12H4"></path></svg>
<span>Войти</span>
</button>
</sc-if>
<sc-if value="{{me.hasKid}}" hint-placeholder-val="{{ false }}">

<section aria-labelledby="um-skills-h" style="background: rgba(255,255,255,.88); border-radius: 36px; padding: 32px; display: flex; flex-direction: column; gap: 22px; margin-top: 12px; box-shadow: 0 1px 0 rgba(30,42,74,.04), 0 22px 50px -18px rgba(43,84,160,.25)">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5578">Для родителей</span>
<h2 id="um-skills-h" style="margin: 0; font-size: 32px; font-weight: 900; line-height: 1.15; text-wrap: balance">Что развивают игры</h2>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px">
<div class="um-skill" style="display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: 26px; background: #FFF3EA">
<span aria-hidden="true" style="width: 54px; height: 54px; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><span style="display: block; width: 30px; height: 30px; background: #F97316; clip-path: polygon(50% 3%, 96% 50%, 50% 97%, 4% 50%)"></span></span>
<h3 style="margin: 0; font-size: 21px; font-weight: 900; color: #9A3412">Внимание</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #33405F">Цвета, предметы и размеры. «Найди такой же», «По порядку», а для малышей «Цвета» и «Предметы».</p>
</div>
<div class="um-skill" style="display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: 26px; background: #EAF1FF">
<span aria-hidden="true" style="width: 54px; height: 54px; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; color: #1D4ED8">1+2</span>
<h3 style="margin: 0; font-size: 21px; font-weight: 900; color: #1D4ED8">Счёт</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #33405F">Малыши 3–4 лет сравнивают «где больше» без цифр. С 5 лет «Посчитай», «Сравни», «Примеры», до таблицы умножения.</p>
</div>
<div class="um-skill" style="display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: 26px; background: #F4EDFF">
<span aria-hidden="true" style="width: 54px; height: 54px; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 3px"><span style="display: block; width: 12px; height: 12px; background: #A855F7; clip-path: circle(48% at 50% 50%)"></span><span style="display: block; width: 12px; height: 12px; background: #7E22CE; clip-path: inset(8% round 16%)"></span><span style="display: block; width: 12px; height: 12px; border: 2px dashed #A855F7; border-radius: 4px; box-sizing: border-box"></span></span>
<h3 style="margin: 0; font-size: 21px; font-weight: 900; color: #7E22CE">Логика</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #33405F">Закономерности и исключения. «Что дальше?» и «Что лишнее?».</p>
</div>
<div class="um-skill" style="display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: 26px; background: #E6F7F0">
<span aria-hidden="true" style="width: 54px; height: 54px; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 4px"><span style="display: block; width: 16px; height: 22px; border-radius: 5px; background: #059669"></span><span style="display: block; width: 16px; height: 22px; border-radius: 5px; background: #A7E3C9"></span></span>
<h3 style="margin: 0; font-size: 21px; font-weight: 900; color: #047857">Память</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #33405F">Запомнить и найти одинаковые карточки. Игра «Найди пару».</p>
</div>
<div class="um-skill" style="display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: 26px; background: #FFF4E4">
<span aria-hidden="true" style="width: 54px; height: 54px; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 1px; font-size: 24px; font-weight: 900"><span style="color: #E8486A">А</span><span style="color: #2F80E8">Б</span></span>
<h3 style="margin: 0; font-size: 21px; font-weight: 900; color: #B45309">Буквы</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #33405F">С 5 лет: узнать букву по звуку и услышать первую букву слова. «Буквы» и «Первая буква».</p>
</div>
</div>
<ol aria-label="Как это работает" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">

<div style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 4px">

</div>

<span style="font-size: 14px; font-weight: 800; opacity: .9">{{lvl.ctaSub}}</span>
</button>
</sc-if>
</div>
<div class="um-diff" role="group" aria-label="Сложность" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{diffs}}" as="df" hint-placeholder-count="3">

<span aria-hidden="true" style="display: flex; align-items: flex-end; gap: 3px; height: 20px">
<sc-for list="{{df.bars}}" as="b" hint-placeholder-count="3"><span style="display: block; width: 8px; height: {{b.h}}px; border-radius: 3px; background: {{b.bg}}"></span></sc-for>
</span>
<span class="um-diff-name" style="font-size: 19px; font-weight: 900; line-height: 1.1">{{df.name}}</span>

<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #33405F">Сейчас вход работает в демо-режиме: аккаунт, профили, возраст, сложность, уровни, звёзды и настройка звука хранятся только в этом браузере на этом устройстве и никуда не отправляются, пароль не сохраняется. Если браузер не разрешает сохранять данные (например, в приватном режиме), игры работают, но звёзды пропадут после закрытия страницы.</p>

        { label: '3–4', text: 'Без цифр и без чтения: каждое задание звучит голосом само. Цвета и названия предметов, большой и маленький, где больше и где меньше, найти такой же, узоры, что лишнее, простые пары.' },
        { label: '5–6', text: 'Первые буквы: найти букву по звуку и первую букву слова. Счёт до 15, узоры и закономерности, «больше — меньше», что лишнее, примеры до 10 и чуть дальше.' },
        { label: '7–9', text: 'Сравнение чисел до 1000, примеры до 100, таблица умножения, числовые ряды, свойства чисел, память и внимание.' }
      ],
      showResetAsk: !st.confirmReset, confirmReset: st.confirmReset, resetDone: st.resetDone,
      resetAsk: function () { self.snd('tap'); self.setState({ confirmReset: true, resetDone: false }); },
      resetCancel: function () { self.snd('tap'); self.setState({ confirmReset: false }); },
      resetDo: function () { self.snd('tap'); self.setState({ best: {}, lv: {}, confirmReset: false, resetDone: true }); self.persist({ best: {}, lv: {} }); }
    };
  }
}

DCLite.mount(Component, document.getElementById('app'), document.getElementById('tpl'), {});
if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
