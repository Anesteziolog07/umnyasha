<meta name="description" content="Развивающие игры для детей 3–6 лет: внимание, счёт, логика, память и первые буквы. Без рекламы и покупок.">

<style>
/* заставка при запуске: видна сразу, пока загружаются игры */
#boot{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(180deg,#7CC8FF 0%,#C6E8FF 50%,#FFF6EA 100%);font-family:'Nunito',system-ui,-apple-system,sans-serif;color:#1E2A4A;transition:opacity .5s ease,transform .5s ease}
#boot.out{opacity:0;transform:scale(1.04);pointer-events:none}
.bt-sun{position:absolute;top:-120px;right:-100px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,#FFE36E 0 30%,rgba(255,227,110,.5) 31%,rgba(255,227,110,.15) 52%,rgba(255,227,110,0) 70%);animation:bt-glow 3s ease-in-out infinite}
.bt-hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:26vh}
.bt-mid{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:-6vh}
.bt-shapes{display:flex;gap:14px;align-items:flex-end;height:96px}
.bt-shapes span{display:block;width:62px;height:62px;animation:bt-jump 1.1s cubic-bezier(.3,0,.3,1) infinite;filter:drop-shadow(0 8px 10px rgba(30,60,120,.25))}
.bt-c{background:radial-gradient(circle at 35% 30%,#FF9A9A,#E53935 60%,#B71C1C);border-radius:50%}
.bt-t{background:linear-gradient(180deg,#FFF07A,#FDD835 55%,#F2A900);clip-path:polygon(50% 4%,98% 94%,2% 94%);animation-delay:.15s!important}
.bt-s{background:linear-gradient(180deg,#90CAF9,#1E88E5 60%,#1257A8);border-radius:16px;animation-delay:.3s!important}
.bt-name{font-size:58px;font-weight:900;letter-spacing:-.02em;line-height:1;text-shadow:0 3px 0 rgba(255,255,255,.7)}
.bt-sub{font-size:21px;font-weight:800;color:#33405F}
.bt-bar{width:220px;height:14px;margin-top:14px;border-radius:999px;background:rgba(255,255,255,.75);overflow:hidden;box-shadow:inset 0 1px 3px rgba(30,42,74,.15)}
.bt-bar span{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#FFB400,#FF6B6B,#5B8CFF);animation:bt-fill 1.5s ease-out forwards}
@keyframes bt-jump{0%,100%{transform:translateY(0) scale(1,1)}10%{transform:translateY(0) scale(1.12,.86)}45%{transform:translateY(-30px) scale(.94,1.06)}80%{transform:translateY(0) scale(1.06,.94)}}
@keyframes bt-fill{to{width:100%}}
@keyframes bt-glow{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){#boot *{animation:none!important}.bt-bar span{width:100%}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0;background:#D6ECFF;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color:#1E2A4A}
a{color:#2557D6}a:hover{color:#1A3FA0}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid #1E2A4A;outline-offset:3px}
button:disabled{cursor:default}
.press{transition:transform .12s ease,box-shadow .12s ease}
.press:hover:not(:disabled){transform:translateY(-2px)}
.press:active:not(:disabled){transform:translateY(1px) scale(.98)}
.shake{animation:um-shake .42s ease}
.pop{animation:um-pop .45s ease}
.flip{animation:um-flip .28s ease}
.bob{animation:um-bob 1s ease-in-out infinite}
.bob2{animation:um-bob 1s ease-in-out .15s infinite}
.bob3{animation:um-bob 1s ease-in-out .3s infinite}
.rise{animation:um-rise .5s ease both}
@keyframes um-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes um-pop{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes um-flip{0%{transform:scaleX(.2)}100%{transform:scaleX(1)}}
@keyframes um-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes um-rise{0%{opacity:0;transform:translateY(12px) scale(.9)}100%{opacity:1;transform:none}}
.pulse{animation:um-pulse 1.6s ease-in-out infinite}
@keyframes um-pulse{0%,100%{box-shadow:0 0 0 0 rgba(30,42,74,.22)}50%{box-shadow:0 0 0 7px rgba(30,42,74,0)}}
.um-lvgrid{grid-template-columns:repeat(10,minmax(0,1fr))}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width: 640px){
.um-head{padding:12px 16px!important;gap:10px!important}
.um-nav{order:3;width:100%;flex-wrap:nowrap!important;gap:6px!important}
.um-nav button{flex:1 1 auto;white-space:nowrap;padding:0 8px!important;font-size:14px!important}
.um-logo-text{font-size:20px!important}
.um-logo-shapes span{width:15px!important;height:15px!important}
.um-tools{gap:6px!important}
.um-tools button,.um-tools > span{padding:0 10px!important;font-size:15px!important;gap:5px!important}
.um-hero{padding:20px!important}
.um-h1{font-size:32px!important}
.um-gbar{gap:8px!important}
.um-gbar-title{order:3;flex-basis:100%!important}
.um-restart{width:52px;padding:0!important;justify-content:center}
.um-restart span{display:none}
.um-lv{padding:18px 14px!important;border-radius:26px!important}
.um-lvgrid{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:8px!important}
.um-lvcta{width:100%}
.um-pages button{font-size:14px!important;padding:0 2px!important}
}
.um-nav.um-hide{display:none!important}
.um-head.um-head-off{display:none!important}
/* обложка и появление игр; fill-mode backwards — после анимации работают обычные эффекты наведения */
.um-intro-in{animation:um-introin .7s cubic-bezier(.2,.9,.3,1.15) backwards}
.um-intro-in2{animation:um-introin2 .8s cubic-bezier(.2,.9,.3,1.15) .35s backwards}
@keyframes um-introin{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
@keyframes um-introin2{from{opacity:0;transform:translateX(40px) rotate(2deg)}to{opacity:1;transform:none}}
.um-word{display:inline-block;animation:um-wordin .6s cubic-bezier(.2,1.4,.4,1) backwards}
@keyframes um-wordin{from{opacity:0;transform:translateY(20px) rotate(-5deg) scale(.9)}to{opacity:1;transform:none}}
.um-wave{display:inline-block;animation:um-wave 1.9s ease-in-out infinite}
@keyframes um-wave{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px)}60%{transform:translateY(-12px)}}
.um-ggrid > *{animation:um-cardin .55s cubic-bezier(.2,.9,.3,1.15) backwards}
.um-ggrid > *:nth-child(2){animation-delay:.06s}.um-ggrid > *:nth-child(3){animation-delay:.12s}.um-ggrid > *:nth-child(4){animation-delay:.18s}
.um-ggrid > *:nth-child(5){animation-delay:.24s}.um-ggrid > *:nth-child(6){animation-delay:.3s}.um-ggrid > *:nth-child(7){animation-delay:.36s}.um-ggrid > *:nth-child(8){animation-delay:.42s}
@keyframes um-cardin{from{opacity:0;transform:translateY(28px) scale(.94)}to{opacity:1;transform:none}}
/* сетка игр: 5 в ряд, на планшете 4, на телефоне 3 */
@media (max-width: 1000px){.um-ggrid{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:14px!important}}
@media (max-width: 640px){.um-ggrid{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:10px!important}.um-gcard{border-radius:20px!important}}
/* обложка: сцена с небом и холмами, выбор возраста крупными карточками */
.um-hero2{position:relative;overflow:hidden;border-radius:36px;min-height:560px;display:flex;flex-direction:column;box-shadow:0 1px 0 rgba(30,42,74,.04),0 26px 60px -20px rgba(43,84,160,.45)}
.um-hscene{position:absolute;inset:0;width:100%;height:100%;display:block}
.um-hs-rays{animation:um-spin 60s linear infinite}
@keyframes um-spin{to{transform:rotate(360deg)}}
.um-hs-cloud{animation:um-hsdrift 18s ease-in-out infinite alternate}
.um-hs-c2{animation-duration:23s;animation-delay:-6s}.um-hs-c3{animation-duration:15s;animation-delay:-3s}
@keyframes um-hsdrift{from{transform:translateX(-30px)}to{transform:translateX(40px)}}
.um-hs-tree{transform-box:fill-box;transform-origin:50% 100%;animation:um-dsway 6s ease-in-out infinite}
.um-hero2-body{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 24px 8px;text-align:center}
.um-hello{margin:0;font-size:50px;line-height:1.05;font-weight:900;letter-spacing:-.02em;color:#1E2A4A;text-wrap:balance;text-shadow:0 2px 0 rgba(255,255,255,.7),0 0 24px rgba(255,255,255,.8)}
.um-hello-sub{margin:4px 0 0;font-size:22px;font-weight:900;color:#2B3C66;text-shadow:0 0 16px rgba(255,255,255,.9)}
.um-agepick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:100%;max-width:620px}
.um-agebtn{min-width:0;border:4px solid #FFFFFF;border-radius:30px;padding:16px 12px 18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:#1E2A4A;box-shadow:0 18px 34px -16px rgba(30,60,120,.45),inset 0 -6px 0 rgba(30,42,74,.06)}
.um-agebtn[aria-pressed="true"]{border-color:#1E2A4A}
.um-agebtn-art{display:flex;align-items:flex-end;justify-content:center;gap:6px;min-height:66px}
.um-agebtn-num{font-size:44px;font-weight:900;line-height:1}
.um-agebtn-num small{font-size:20px;font-weight:900}
.um-agebtn-hint{font-size:15px;font-weight:800;color:#4A5578}
.um-keepage{min-height:44px;padding:0 18px;border-radius:999px;border:2px solid #FFFFFF;background:rgba(255,255,255,.85);color:#1E2A4A;font-size:16px;font-weight:800;cursor:pointer}
.um-hero2-toys{position:relative;margin-top:auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:6px 18px;padding:12px 16px 26px}
/* «Для родителей»: описание открывается по кнопке */
.um-parents{background:rgba(255,255,255,.9);border-radius:30px;margin-top:8px;box-shadow:0 1px 0 rgba(30,42,74,.04),0 18px 40px -18px rgba(43,84,160,.25);overflow:hidden}
.um-parents-btn{width:100%;display:flex;align-items:center;gap:14px;padding:18px 22px;border:0;background:transparent;color:#1E2A4A;cursor:pointer;text-align:left}
.um-parents-ic{flex:none;width:48px;height:48px;border-radius:16px;background:#EAF1FF;color:#2557D6;display:flex;align-items:center;justify-content:center}
.um-parents-t{flex:1 1 auto;display:flex;flex-direction:column;gap:2px;min-width:0}
.um-parents-t span{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#4A5578}
.um-parents-t strong{font-size:22px;font-weight:900}
.um-parents-ch{flex:none;transition:transform .25s ease}.um-parents-ch.um-open{transform:rotate(180deg)}
.um-parents-body{display:flex;flex-direction:column;gap:18px;padding:0 22px 24px}
.um-parents-facts{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.um-parents-facts li{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:999px;background:#F2F7FF;border:1.5px solid #D7E5FA;font-size:15px;font-weight:800}
/* плитки игр: квадратная картинка и название — на телефоне три в ряд, всё видно без прокрутки */
.um-gstars{position:absolute;top:8px;right:8px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.92);font-size:14px;font-weight:900;color:#B7791F}
.um-gtitle{display:block;padding:10px 8px 12px;font-size:18px;font-weight:900;line-height:1.15}
@media (max-width: 640px){
.um-hero2{min-height:0;border-radius:28px}
.um-hero2-body{padding:26px 14px 4px;gap:10px}
.um-hello{font-size:31px}
.um-hello-sub{font-size:19px}
.um-agepick{gap:10px}
.um-agebtn{border-radius:24px;padding:12px 6px 14px}
.um-agebtn-art{min-height:52px}
.um-agebtn-art .um-item{width:42px!important;height:42px!important}
.um-agebtn-num{font-size:34px}
.um-agebtn-hint{font-size:13px}
.um-hero2-toys{gap:4px 8px;padding:8px 8px 18px}
.um-hero2-toys .um-item{width:40px!important;height:40px!important}
.um-gtitle{font-size:14px;padding:7px 4px 9px}
.um-gstars{top:5px;right:5px;font-size:12px;padding:2px 6px}
.um-parents-btn{padding:14px 16px}
.um-parents-t strong{font-size:19px}
.um-parents-body{padding:0 16px 18px}
}

.um-gscene{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.um-gcard{transition:transform .18s ease,box-shadow .25s ease}
.um-gcard:hover{box-shadow:0 1px 0 rgba(30,42,74,.04),0 26px 50px -16px rgba(43,84,160,.42)!important}
.um-gcard:hover .um-gscene{transform:scale(1.06)}
/* предметы в играх */
.um-shadow{filter:brightness(0) opacity(.5)!important}
.um-shelves{width:100%;max-width:560px;display:flex;flex-direction:column;gap:6px;padding:14px 18px 18px;box-sizing:border-box;border-radius:24px;background:linear-gradient(180deg,#FFF7EC,#F6E7D2);border:6px solid #D9A46A}
.um-shelf{display:flex;flex-direction:column}
.um-shelf-items{min-height:84px;display:flex;align-items:flex-end;justify-content:space-around;gap:10px;padding:0 10px}
.um-shelf-board{height:12px;border-radius:6px;background:linear-gradient(180deg,#E8B77E,#C98A55);box-shadow:0 4px 0 rgba(150,90,40,.25)}
.um-rest-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;width:100%}
.um-rest-step{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 12px;border-radius:22px;background:#F2F8FF;font-size:18px;font-weight:800;color:#1E2A4A}
.um-item{display:inline-block;flex:none;filter:drop-shadow(0 4px 5px rgba(60,90,150,.16))}
@keyframes um-ibob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-4deg)}}
/* предметы на фоне */
.um-pk{position:absolute;display:block}
.um-dm{display:block;width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(40,80,150,.18))}
.um-dfloat{animation:um-float 8s ease-in-out infinite}
.um-dspin{animation:um-dspin 20s linear infinite}
@keyframes um-dspin{to{transform:rotate(360deg)}}
.um-drise{animation:um-drise 9s ease-in-out infinite}
@keyframes um-drise{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-26px) rotate(4deg)}}
.um-dsway{transform-origin:50% 100%;animation:um-dsway 5s ease-in-out infinite;filter:none}
@keyframes um-dsway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.um-pop-a{animation:um-pop-a .8s cubic-bezier(.2,1.5,.4,1) both}
.um-pop-b{animation:um-pop-b .8s cubic-bezier(.2,1.5,.4,1) both}
@keyframes um-pop-a{from{transform:scale(0) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes um-pop-b{from{transform:scale(0) rotate(25deg);opacity:0}to{transform:none;opacity:1}}
@media (max-width: 640px){
/* на узком экране оставляем каждое второе растение — так они равномерно по всей ширине */
.um-plants .um-pk:nth-child(even){display:none}
.um-pk{width:52px!important;height:52px!important}
}
/* небо: облака, солнце, змей и фигурки; слой под всем содержимым */
.um-sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.um-sun{position:absolute;top:-90px;right:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#FFE48A 0 34%,rgba(255,228,138,.55) 35%,rgba(255,228,138,.2) 52%,rgba(255,228,138,0) 70%);animation:um-glow 7s ease-in-out infinite}
@keyframes um-glow{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.um-cloud{position:absolute;left:0;height:auto;animation:um-drift linear infinite;filter:drop-shadow(0 10px 18px rgba(80,130,200,.12))}
@keyframes um-drift{from{transform:translateX(-35vw)}to{transform:translateX(110vw)}}
.um-c1{top:7%;width:230px;animation-duration:100s;animation-delay:-18s}
.um-c2{top:22%;width:160px;animation-duration:130s;animation-delay:-80s;opacity:.92}
.um-c3{top:43%;width:270px;animation-duration:150s;animation-delay:-40s;opacity:.85}
.um-c4{top:61%;width:180px;animation-duration:115s;animation-delay:-95s;opacity:.85}
.um-c5{top:78%;width:240px;animation-duration:140s;animation-delay:-8s;opacity:.8}
.um-c6{top:13%;width:120px;animation-duration:90s;animation-delay:-58s;opacity:.95}
.um-fl{position:absolute;display:block;opacity:.75;animation:um-float 9s ease-in-out infinite}
@keyframes um-float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-18px) rotate(14deg)}}
.um-f1{top:30%;right:4%;width:26px;height:26px}
.um-f2{top:56%;left:2.5%;width:18px;height:18px;animation-delay:-3s}
.um-f3{top:70%;right:3%;width:22px;height:22px;animation-delay:-5s}
.um-f4{top:40%;left:5%;width:16px;height:16px;animation-delay:-7s}
.um-f5{top:88%;right:8%;width:18px;height:18px;animation-delay:-2s}
.um-sky.um-calm .um-cloud{opacity:.45}
@media (prefers-reduced-motion: reduce){
.um-c1{left:6%}.um-c2{left:58%}.um-c3{left:24%}.um-c4{left:72%}.um-c5{left:4%}.um-c6{left:40%}
}
@media (max-width: 640px){
.um-cloud{transform-origin:0 0}
.um-c1{width:150px}.um-c2{width:110px}.um-c3{width:170px}.um-c4{width:120px}.um-c5{width:150px}.um-c6{width:90px}
.um-sun{width:200px;height:200px;top:-70px;right:-70px}
.um-fl{display:none}
}
/* шапка: белая «стеклянная» панель; на телефоне не прилипает, чтобы не занимать экран */
.um-head{position:sticky;top:10px;z-index:30}
@media (max-width: 1000px){.um-head{position:relative}}
@media (max-width: 640px){.um-head{position:static;margin:8px 8px 12px!important;width:auto!important}}
.um-chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;background:#F2F7FF;border:1.5px solid #D7E5FA;font-size:15px;font-weight:800;color:#1E2A4A}
.um-skill{transition:transform .2s ease}
.um-skill:hover{transform:translateY(-3px)}
@media (max-width: 900px){.um-agecard{max-width:none!important;margin-left:0!important}}
.um-input:focus{outline:3px solid #2557D6;outline-offset:1px;border-color:#2557D6!important}
input[type=checkbox]:focus-visible{outline:3px solid #2557D6;outline-offset:2px}
summary:focus-visible{outline:3px solid #2557D6;outline-offset:3px;border-radius:6px}
/* предметы: анимация (design/items.py) */
.um-item [class^="ua-"],.um-item [class*=" ua-"]{transform-box:view-box;animation-delay:var(--d,0s)}
.ua-bounce{animation:ua-bounce 1.7s cubic-bezier(.45,0,.55,1) infinite}
@keyframes ua-bounce{0%,100%{transform:translateY(0) scale(1.06,.94)}14%{transform:translateY(-1px) scale(.97,1.03)}50%{transform:translateY(-9px) scale(1,1)}86%{transform:translateY(-1px) scale(.97,1.03)}}
.ua-shad{animation:ua-shad 1.7s cubic-bezier(.45,0,.55,1) infinite}
@keyframes ua-shad{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.68);opacity:.5}}
.ua-hop2{animation:ua-hop2 2.6s ease-in-out infinite}
@keyframes ua-hop2{0%,55%,100%{transform:translateY(0) scale(1,1)}62%{transform:translateY(0) scale(1.06,.92)}72%{transform:translateY(-7px) scale(.96,1.05) rotate(-4deg)}84%{transform:translateY(0) scale(1.04,.96)}92%{transform:translateY(0) scale(1,1)}}
.ua-shad2{animation:ua-shad2 2.6s ease-in-out infinite}
@keyframes ua-shad2{0%,62%,84%,100%{transform:scale(1);opacity:1}72%{transform:scale(.75);opacity:.6}}
.ua-float{animation:ua-float 3.4s ease-in-out infinite}
@keyframes ua-float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}

<sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}">
<div role="status" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px">
<div aria-hidden="true" style="display: flex; gap: 16px; align-items: flex-end">
<span class="bob" style="display: block; width: 44px; height: 44px; background: #EF4444; clip-path: circle(48% at 50% 50%)"></span>
<span class="bob2" style="display: block; width: 44px; height: 44px; background: #FACC15; clip-path: polygon(50% 5%, 97% 93%, 3% 93%)"></span>
<span class="bob3" style="display: block; width: 44px; height: 44px; background: #3B82F6; clip-path: inset(8% round 16%)"></span>
</div>
<p style="margin: 0; font-size: 24px; font-weight: 800">Загружаем игры…</p>
</div>
</sc-if>

<sc-if value="{{isReady}}" hint-placeholder-val="{{ true }}">
<header class="um-head {{headCls}}" style="width: calc(100% - 32px); max-width: 1088px; margin: 12px auto 18px; padding: 10px 14px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; background: rgba(255,255,255,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 28px; border: 1.5px solid rgba(255,255,255,.95); box-shadow: 0 12px 32px -14px rgba(43,84,160,.4)">
<button type="button" class="press" onClick="{{goHome}}" aria-label="Умняша, на главную" style="display: flex; align-items: center; gap: 10px; background: transparent; border: 0; padding: 6px 4px; cursor: pointer; color: #1E2A4A">
<span class="um-logo-shapes" aria-hidden="true" style="display: flex; gap: 3px; align-items: center">
<span style="display: block; width: 22px; height: 22px; background: #EF4444; clip-path: circle(48% at 50% 50%)"></span>
<span style="display: block; width: 22px; height: 22px; background: #FACC15; clip-path: polygon(50% 5%, 97% 93%, 3% 93%)"></span>
<span style="display: block; width: 22px; height: 22px; background: #3B82F6; clip-path: inset(8% round 16%)"></span>
</span>
<span class="um-logo-text" style="font-size: 28px; font-weight: 900; letter-spacing: -0.01em">Умняша</span>
</button>
<nav class="um-nav {{navCls}}" aria-label="Разделы" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="3">
<button type="button" class="press" onClick="{{n.go}}" aria-current="{{n.current}}" style="min-height: 48px; padding: 0 18px; border-radius: 999px; border: 2px solid #1E2A4A; background: {{n.bg}}; color: {{n.fg}}; font-size: 17px; font-weight: 800; cursor: pointer">{{n.label}}</button>
</sc-for>
</nav>
<div class="um-tools" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<sc-if value="{{me.guest}}" hint-placeholder-val="{{ true }}">
<button type="button" class="press" onClick="{{me.login}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 999px; border: 2px solid #1E2A4A; background: #FFFFFF; color: #1E2A4A; font-size: 17px; font-weight: 800; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"></path><path d="M9 16l4-4-4-4"></path><path d="M13 12H4"></path></svg>
<span>Войти</span>
</button>
</sc-if>
<sc-if value="{{me.hasKid}}" hint-placeholder-val="{{ false }}">
<button type="button" class="press" onClick="{{me.who}}" aria-label="{{me.aria}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px 0 8px; border-radius: 999px; border: 2px solid #1E2A4A; background: #FFFFFF; color: #1E2A4A; font-size: 17px; font-weight: 900; cursor: pointer; max-width: 220px">
<span aria-hidden="true" style="flex: none; display: block; width: 32px; height: 32px; background: {{me.bg}}; clip-path: {{me.clip}}"></span>
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{me.name}}</span>
</button>
</sc-if>
<sc-if value="{{me.noKid}}" hint-placeholder-val="{{ false }}">
<button type="button" class="press" onClick="{{me.add}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 18px; border-radius: 999px; border: 2px dashed #1E2A4A; background: #FFFFFF; color: #1E2A4A; font-size: 17px; font-weight: 800; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
<span>Профиль ребёнка</span>
</button>
</sc-if>
<span aria-label="{{starsAria}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 16px; border-radius: 999px; background: #FFFFFF; font-size: 18px; font-weight: 900">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.85 6 6.55.8-4.85 4.55 1.3 6.5L12 17.25 6.15 20.45l1.3-6.5L2.6 9.4l6.55-.8z" fill="#FFB400" stroke="#E09A00" stroke-width="1.4" stroke-linejoin="round"></path></svg>
<span>{{totalStars}}</span>
</span>
<button type="button" class="press" onClick="{{toggleSound}}" aria-pressed="{{soundPressed}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 999px; border: 2px solid {{soundBd}}; background: {{soundBg}}; color: {{soundFg}}; font-size: 17px; font-weight: 800; cursor: pointer">
<sc-if value="{{soundOn}}" hint-placeholder-val="{{ true }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"></path><path d="M15.5 9a4.2 4.2 0 0 1 0 6"></path><path d="M18 6.5a7.6 7.6 0 0 1 0 11"></path></svg></sc-if>
<sc-if value="{{soundOff}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"></path><path d="M16 9.5l5 5"></path><path d="M21 9.5l-5 5"></path></svg></sc-if>
<span>{{soundLabel}}</span>
</button>
</div>
</header>

<sc-if value="{{notice.show}}" hint-placeholder-val="{{ false }}">
<div role="status" style="max-width: 1120px; margin: 0 auto 12px; padding: 0 16px; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 18px; border-radius: 20px; background: #E7F8EE; color: #14532D; font-size: 17px; font-weight: 800">
<span style="flex: 1 1 auto; min-width: 0">{{notice.text}}</span>
<button type="button" class="press" onClick="{{notice.close}}" aria-label="Закрыть сообщение" style="flex: none; width: 44px; height: 44px; border-radius: 999px; border: 0; background: #FFFFFF; color: #14532D; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
</button>
</div>
</div>
</sc-if>

<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<main style="max-width: 1120px; margin: 0 auto; padding: 4px 16px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">

<button type="button" class="press um-parents-btn" onClick="{{toggleParents}}" aria-expanded="{{parentsAria}}">
<span class="um-parents-ic" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6"></path><circle cx="12" cy="7.6" r=".6" fill="currentColor"></circle></svg></span>
<span class="um-parents-t"><span>Для родителей</span><strong>Что развивают игры</strong></span>
<svg class="um-parents-ch {{parentsCh}}" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<sc-if value="{{parentsOpen}}" hint-placeholder-val="{{ false }}">
<div class="um-parents-body rise">
<ul class="um-parents-facts"><li>По 50 уроков в каждой игре</li><li>Сначала знакомство, потом закрепление</li><li>Без рекламы и покупок</li><li>Данные остаются на устройстве</li><li>Перерыв для глаз каждые 15 минут</li></ul>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px">
<div class="um-skill" style="display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: 26px; background: #FFF3EA">
<span aria-hidden="true" style="width: 54px; height: 54px; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><span style="display: block; width: 30px; height: 30px; background: #F97316; clip-path: polygon(50% 3%, 96% 50%, 50% 97%, 4% 50%)"></span></span>
<h3 style="margin: 0; font-size: 21px; font-weight: 900; color: #9A3412">Внимание</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #33405F">Цвета, предметы и размеры. «Найди такой же», «По порядку», «Тени», а для малышей «Цвета» и «Предметы».</p>
</div>
<div class="um-skill" style="display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: 26px; background: #EAF1FF">
<span aria-hidden="true" style="width: 54px; height: 54px; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; color: #1D4ED8">1+2</span>
<h3 style="margin: 0; font-size: 21px; font-weight: 900; color: #1D4ED8">Счёт</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #33405F">Малыши 3–4 лет сравнивают «где больше» без цифр. С 5 лет «Посчитай», «Сравни» и «Примеры».</p>
</div>
<div class="um-skill" style="display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: 26px; background: #F4EDFF">
<span aria-hidden="true" style="width: 54px; height: 54px; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 3px"><span style="display: block; width: 12px; height: 12px; background: #A855F7; clip-path: circle(48% at 50% 50%)"></span><span style="display: block; width: 12px; height: 12px; background: #7E22CE; clip-path: inset(8% round 16%)"></span><span style="display: block; width: 12px; height: 12px; border: 2px dashed #A855F7; border-radius: 4px; box-sizing: border-box"></span></span>
<h3 style="margin: 0; font-size: 21px; font-weight: 900; color: #7E22CE">Логика</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #33405F">Закономерности и исключения. «Что дальше?» и «Что лишнее?».</p>
</div>
<div class="um-skill" style="display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: 26px; background: #E6F7F0">
<span aria-hidden="true" style="width: 54px; height: 54px; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 4px"><span style="display: block; width: 16px; height: 22px; border-radius: 5px; background: #059669"></span><span style="display: block; width: 16px; height: 22px; border-radius: 5px; background: #A7E3C9"></span></span>
<h3 style="margin: 0; font-size: 21px; font-weight: 900; color: #047857">Память</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #33405F">Запомнить и найти одинаковые карточки, заметить, что пропало. «Найди пару» и «Что пропало?».</p>
</div>
<div class="um-skill" style="display: flex; flex-direction: column; gap: 10px; padding: 20px; border-radius: 26px; background: #FFF4E4">
<span aria-hidden="true" style="width: 54px; height: 54px; border-radius: 18px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 1px; font-size: 24px; font-weight: 900"><span style="color: #E8486A">А</span><span style="color: #2F80E8">Б</span></span>
<h3 style="margin: 0; font-size: 21px; font-weight: 900; color: #B45309">Буквы</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #33405F">С 5 лет: узнать букву по звуку и услышать первую букву слова. «Буквы» и «Первая буква».</p>
</div>
</div>
<ol aria-label="Как это работает" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<li style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 22px; background: #F6F9FF"><span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #1E2A4A; color: #FFFFFF; font-size: 19px; font-weight: 900; display: flex; align-items: center; justify-content: center">1</span><span style="font-size: 16px; font-weight: 800">Выберите возраст ребёнка</span></li>
<li style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 22px; background: #F6F9FF"><span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #1E2A4A; color: #FFFFFF; font-size: 19px; font-weight: 900; display: flex; align-items: center; justify-content: center">2</span><span style="font-size: 16px; font-weight: 800">Проходите уроки по порядку: знакомство и 5 заданий</span></li>
<li style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 22px; background: #F6F9FF"><span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #1E2A4A; color: #FFFFFF; font-size: 19px; font-weight: 900; display: flex; align-items: center; justify-content: center">3</span><span style="font-size: 16px; font-weight: 800">Собирайте звёзды и следите за успехами</span></li>
</ol>
</div>
</sc-if>

<div style="flex: 999 1 320px; min-width: 0; padding: 26px; display: flex; flex-direction: column; justify-content: center; gap: 6px">
<span style="font-size: 14px; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase; color: {{hub.catFg}}">{{hub.catName}}</span>
<h1 style="margin: 0; font-size: 38px; font-weight: 900; line-height: 1.1">{{hub.title}}</h1>
<p style="margin: 0; font-size: 18px; color: #4A5578">{{hub.sub}}</p>
<p style="margin: 6px 0 0; font-size: 16px; font-weight: 800; color: #33405F">{{hub.progress}}</p>
</div>
</section>
<section class="um-lv" aria-labelledby="um-lv-h" style="background: #FFFFFF; border-radius: 32px; padding: 24px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 1px 0 rgba(30,42,74,.04), 0 22px 50px -18px rgba(43,84,160,.3)">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px">
<div style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<h2 id="um-lv-h" style="margin: 0; font-size: 30px; font-weight: 900; line-height: 1.1">Уроки</h2>
<p style="margin: 0; font-size: 17px; color: #4A5578">{{lvl.sub}}</p>
</div>
<sc-if value="{{lvl.ctaShow}}" hint-placeholder-val="{{ true }}">
<button type="button" class="press um-lvcta" onClick="{{lvl.ctaGo}}" style="min-height: 64px; padding: 8px 26px; border-radius: 22px; border: 0; background: {{accent}}; color: #FFFFFF; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 4px 0 rgba(30,42,74,.18)">
<span style="font-size: 21px; font-weight: 900; line-height: 1.1">{{lvl.cta}}</span>
<span style="font-size: 14px; font-weight: 800; opacity: .9">{{lvl.ctaSub}}</span>
</button>
</sc-if>
</div>
<div class="um-lvgrid" style="display: grid; gap: 10px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="20">
<button type="button" class="press {{c.anim}}" onClick="{{c.open}}" disabled="{{c.locked}}" aria-label="{{c.aria}}" style="min-width: 0; min-height: 74px; border-radius: 18px; border: 3px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; cursor: {{c.cursor}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 6px 2px">
<sc-if value="{{c.isOpen}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 23px; font-weight: 900; line-height: 1">{{c.n}}</span>
<span aria-hidden="true" style="display: flex; gap: 1px"><sc-for list="{{c.stars}}" as="s" hint-placeholder-count="3"><svg width="{{s.size}}" height="{{s.size}}" viewBox="0 0 24 24"><path d="M12 2.6l2.85 6 6.55.8-4.85 4.55 1.3 6.5L12 17.25 6.15 20.45l1.3-6.5L2.6 9.4l6.55-.8z" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="1.6" stroke-linejoin="round"></path></svg></sc-for></span>
</sc-if>
<sc-if value="{{c.locked}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 15px; font-weight: 800; line-height: 1">{{c.n}}</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
</sc-if>
</button>
</sc-for>
</div>
</section>
</main>
</sc-if>

<sc-if value="{{isGame}}" hint-placeholder-val="{{ false }}">
<main style="max-width: 980px; margin: 0 auto; padding: 4px 16px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<div class="um-gbar" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<button type="button" class="press" onClick="{{game.backGo}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 20px 0 14px; border-radius: 999px; border: 2px solid #1E2A4A; background: #FFFFFF; color: #1E2A4A; font-size: 18px; font-weight: 900; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
<span>{{game.back}}</span>
</button>
<div class="um-gbar-title" style="display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1 1 200px; min-width: 0">
<span style="font-size: 22px; font-weight: 900; text-align: center">{{game.title}}</span>
<sc-if value="{{game.hasSub}}" hint-placeholder-val="{{ false }}"><span style="font-size: 15px; font-weight: 800; color: #4A5578; text-align: center; margin-top: -4px">{{game.sub}}</span></sc-if>
<span style="display: flex; align-items: center; gap: 6px" aria-label="{{game.counter}}">
<sc-for list="{{game.dots}}" as="d" hint-placeholder-count="5"><span aria-hidden="true" style="display: block; width: {{d.w}}px; height: 12px; border-radius: 999px; background: {{d.bg}}"></span></sc-for>
</span>
<span style="font-size: 15px; font-weight: 800; color: #4A5578">{{game.counter}}</span>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<button type="button" class="press um-restart" onClick="{{restart}}" aria-label="Заново" style="display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 18px; border-radius: 999px; border: 2px solid #C9D3EE; background: #FFFFFF; color: #1E2A4A; font-size: 17px; font-weight: 800; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"></path><path d="M4 4v4.5h4.5"></path></svg>
<span>Заново</span>
</button>
<button type="button" class="press um-gsound" onClick="{{toggleSound}}" aria-pressed="{{soundPressed}}" aria-label="{{soundLabel}}" style="width: 52px; height: 52px; border-radius: 999px; border: 2px solid {{soundBd}}; background: {{soundBg}}; color: {{soundFg}}; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<sc-if value="{{soundOn}}" hint-placeholder-val="{{ true }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"></path><path d="M15.5 9a4.2 4.2 0 0 1 0 6"></path><path d="M18 6.5a7.6 7.6 0 0 1 0 11"></path></svg></sc-if>
<sc-if value="{{soundOff}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"></path><path d="M16 9.5l5 5"></path><path d="M21 9.5l-5 5"></path></svg></sc-if>
</button>
</div>
</div>

<section style="background: #FFFFFF; border-radius: 32px; padding: 24px 16px 28px; display: flex; flex-direction: column; align-items: center; gap: 18px; box-shadow: 0 1px 0 rgba(30,42,74,.04), 0 22px 50px -18px rgba(43,84,160,.3)">
<div style="display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap">
<h1 style="margin: 0; font-size: 32px; line-height: 1.15; font-weight: 900; text-align: center">{{game.prompt}}</h1>

<sc-if value="{{isResult}}" hint-placeholder-val="{{ false }}">
<main style="max-width: 720px; margin: 0 auto; padding: 8px 16px 0; box-sizing: border-box">
<section class="rise" style="background: #FFFFFF; border-radius: 32px; padding: 36px 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; box-shadow: 0 1px 0 rgba(30,42,74,.04), 0 22px 50px -18px rgba(43,84,160,.3)">
<span style="font-size: 16px; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase; color: #4A5578">{{res.gameTitle}}</span>
<div role="img" aria-label="{{res.starsAria}}" style="display: flex; gap: 8px; align-items: flex-end">
<sc-for list="{{res.stars}}" as="s" hint-placeholder-count="3"><svg class="pop" width="{{s.size}}" height="{{s.size}}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.85 6 6.55.8-4.85 4.55 1.3 6.5L12 17.25 6.15 20.45l1.3-6.5L2.6 9.4l6.55-.8z" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="1.2" stroke-linejoin="round"></path></svg></sc-for>
</div>
<h1 style="margin: 0; font-size: 40px; font-weight: 900; line-height: 1.1">{{res.title}}</h1>
<p style="margin: 0; font-size: 19px; color: #4A5578; max-width: 440px">{{res.text}}</p>
<sc-if value="{{res.isRecord}}" hint-placeholder-val="{{ false }}"><span style="background: #FFF4D6; color: #7A5200; border-radius: 999px; padding: 8px 18px; font-size: 17px; font-weight: 900">Новый рекорд!</span></sc-if>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 8px">
<button type="button" class="press" onClick="{{res.replay}}" style="min-height: 56px; padding: 0 24px; border-radius: 999px; border: 2px solid #1E2A4A; background: #FFFFFF; color: #1E2A4A; font-size: 19px; font-weight: 900; cursor: pointer">Ещё раз</button>
<sc-if value="{{res.hasNext}}" hint-placeholder-val="{{ true }}"><button type="button" class="press" onClick="{{res.next}}" style="min-height: 56px; padding: 0 24px; border-radius: 999px; border: 2px solid {{accent}}; background: {{accent}}; color: #FFFFFF; font-size: 19px; font-weight: 900; cursor: pointer">{{res.nextLabel}}</button></sc-if>
<button type="button" class="press" onClick="{{res.homeGo}}" style="min-height: 56px; padding: 0 24px; border-radius: 999px; border: 2px solid #C9D3EE; background: #FFFFFF; color: #1E2A4A; font-size: 19px; font-weight: 800; cursor: pointer">{{res.homeLabel}}</button>
</div>
</section>
</main>
</sc-if>

<sc-if value="{{isRest}}" hint-placeholder-val="{{ false }}">
<main style="max-width: 760px; margin: 0 auto; padding: 8px 16px 0; box-sizing: border-box">

<sc-if value="{{auth.isSignup}}" hint-placeholder-val="{{ false }}">

<button type="button" class="press" onClick="{{ks.pick}}" aria-pressed="{{ks.pressed}}" aria-label="{{ks.aria}}" style="min-width: 0; aspect-ratio: 1; max-width: 100%; border-radius: 18px; border: 3px solid {{ks.bd}}; background: #F8FAFF; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 8px">
<span aria-hidden="true" style="display: block; width: 70%; height: 70%; background: {{ks.bg}}; clip-path: {{ks.clip}}"></span>
</button>
</sc-for>
</div>
</fieldset>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
<legend style="padding: 0; margin-bottom: 8px; font-size: 16px; font-weight: 800">Цвет</legend>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{kidf.colors}}" as="kc" hint-placeholder-count="6">
<button type="button" class="press" onClick="{{kc.pick}}" aria-pressed="{{kc.pressed}}" aria-label="{{kc.aria}}" style="min-width: 0; aspect-ratio: 1; max-width: 100%; border-radius: 999px; border: 4px solid {{kc.bd}}; box-shadow: 0 0 0 2px #D5DDF2; background: {{kc.bg}}; cursor: pointer"></button>
</sc-for>
</div>
</fieldset>
<sc-if value="{{kidf.hasErr}}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 0; padding: 12px 14px; border-radius: 14px; background: #FEECEB; color: #A11A12; font-size: 16px; font-weight: 800">{{kidf.err}}</p>
</sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="submit" class="press" style="flex: 1 1 200px; min-height: 56px; border-radius: 999px; border: 0; background: {{accent}}; color: #FFFFFF; font-size: 19px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 rgba(30,42,74,.18)">Сохранить</button>
<button type="button" class="press" onClick="{{kidf.cancel}}" style="flex: 0 1 160px; min-height: 56px; border-radius: 999px; border: 2px solid #1E2A4A; background: #FFFFFF; color: #1E2A4A; font-size: 18px; font-weight: 800; cursor: pointer">Отмена</button>
</div>
</form>
<sc-if value="{{kidf.canDelete}}" hint-placeholder-val="{{ false }}">
<div style="border-top: 2px solid #EEF1F8; padding-top: 18px; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{kidf.showDelAsk}}" hint-placeholder-val="{{ true }}">
<div><button type="button" class="press" onClick="{{kidf.askDel}}" style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: 2px solid #B4470F; background: #FFFFFF; color: #B4470F; font-size: 17px; font-weight: 900; cursor: pointer">Удалить профиль</button></div>
</sc-if>
<sc-if value="{{kidf.confirmDel}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px; border-radius: 20px; background: #FFF1E8">
<span style="flex: 1 1 260px; font-size: 17px; font-weight: 900; color: #7A3208">Удалить профиль «{{kidf.prevName}}» вместе со звёздами и уроками?</span>
<button type="button" class="press" onClick="{{kidf.doDel}}" style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: 0; background: #B4470F; color: #FFFFFF; font-size: 17px; font-weight: 900; cursor: pointer">Да, удалить</button>
<button type="button" class="press" onClick="{{kidf.cancelDel}}" style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: 2px solid #1E2A4A; background: #FFFFFF; color: #1E2A4A; font-size: 17px; font-weight: 800; cursor: pointer">Отмена</button>
</div>
</sc-if>
</div>
</sc-if>
</section>
</main>
</sc-if>

<sc-if value="{{isAccount}}" hint-placeholder-val="{{ false }}">
<main style="max-width: 860px; margin: 0 auto; padding: 4px 16px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<section style="background: #1E2A4A; color: #FFFFFF; border-radius: 32px; padding: 28px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: #C9D3EE">Аккаунт родителя</span>
<h1 style="margin: 0; font-size: 34px; font-weight: 900; overflow-wrap: anywhere">{{acct.title}}</h1>
<p style="margin: 0; font-size: 18px; color: #E3E9F8; overflow-wrap: anywhere">{{acct.email}}</p>
<sc-if value="{{acct.hasSince}}" hint-placeholder-val="{{ true }}"><p style="margin: 0; font-size: 15px; color: #C9D3EE">{{acct.since}}</p></sc-if>
</section>
<section style="background: #FFFFFF; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 24px; font-weight: 900">Дети</h2>
<sc-if value="{{acct.hasKids}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{acct.kids}}" as="ak" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 20px; background: #F4F7FF; flex-wrap: wrap">
<span aria-hidden="true" style="flex: none; display: block; width: 48px; height: 48px; background: {{ak.bg}}; clip-path: {{ak.clip}}"></span>
<div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 19px; font-weight: 900; overflow-wrap: anywhere">{{ak.name}}</span>
<span style="font-size: 14px; font-weight: 700; color: #4A5578">{{ak.info}}</span>
</div>
<button type="button" class="press" onClick="{{ak.edit}}" aria-label="{{ak.editAria}}" style="flex: none; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #1E2A4A; background: #FFFFFF; color: #1E2A4A; font-size: 16px; font-weight: 800; cursor: pointer">Изменить</button>
</div>
</sc-for>
</div>
<p style="margin: 0; font-size: 14px; color: #4A5578">Уровни: пройдено во всех играх на сложностях «Лёгкий / Средний / Сложный» для выбранного возраста.</p>
</sc-if>
<div><button type="button" class="press" onClick="{{acct.add}}" style="min-height: 52px; padding: 0 22px; border-radius: 999px; border: 0; background: {{accent}}; color: #FFFFFF; font-size: 18px; font-weight: 900; cursor: pointer">Добавить ребёнка</button></div>
</section>
<section style="background: #FFFFFF; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 24px; font-weight: 900">Вход и данные</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #33405F">Сейчас это демо-версия: аккаунт и профили хранятся только в этом браузере. Пароль не сохраняется. Когда подключим сервер, вход заработает с проверкой пароля и на любом устройстве.</p>
<sc-if value="{{acct.showAsk}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" class="press" onClick="{{acct.logoutAsk}}" style="min-height: 50px; padding: 0 22px; border-radius: 999px; border: 2px solid #1E2A4A; background: #FFFFFF; color: #1E2A4A; font-size: 17px; font-weight: 900; cursor: pointer">Выйти из аккаунта</button>
<button type="button" class="press" onClick="{{acct.delAsk}}" style="min-height: 50px; padding: 0 22px; border-radius: 999px; border: 2px solid #B4470F; background: #FFFFFF; color: #B4470F; font-size: 17px; font-weight: 900; cursor: pointer">Удалить аккаунт</button>
</div>
</sc-if>
<sc-if value="{{acct.askOut}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px; border-radius: 20px; background: #EEF3FF">
<span style="flex: 1 1 260px; font-size: 17px; font-weight: 900">Выйти? Профили детей останутся, войти можно снова по этой почте.</span>
<button type="button" class="press" onClick="{{acct.logout}}" style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: 0; background: #1E2A4A; color: #FFFFFF; font-size: 17px; font-weight: 900; cursor: pointer">Да, выйти</button>
<button type="button" class="press" onClick="{{acct.cancel}}" style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: 2px solid #1E2A4A; background: #FFFFFF; color: #1E2A4A; font-size: 17px; font-weight: 800; cursor: pointer">Отмена</button>
</div>
</sc-if>
<sc-if value="{{acct.askDel}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px; border-radius: 20px; background: #FFF1E8">
<span style="flex: 1 1 260px; font-size: 17px; font-weight: 900; color: #7A3208">Удалить аккаунт и все профили детей со звёздами? Это нельзя отменить.</span>
<button type="button" class="press" onClick="{{acct.del}}" style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: 0; background: #B4470F; color: #FFFFFF; font-size: 17px; font-weight: 900; cursor: pointer">Да, удалить</button>
<button type="button" class="press" onClick="{{acct.cancel}}" style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: 2px solid #1E2A4A; background: #FFFFFF; color: #1E2A4A; font-size: 17px; font-weight: 800; cursor: pointer">Отмена</button>
</div>
</sc-if>
</section>
</main>
</sc-if>

<sc-if value="{{isGate}}" hint-placeholder-val="{{ false }}">
<main style="max-width: 520px; margin: 0 auto; padding: 4px 16px 0; box-sizing: border-box">
<section style="background: #FFFFFF; border-radius: 32px; padding: 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 1px 0 rgba(30,42,74,.04), 0 22px 50px -18px rgba(43,84,160,.3)">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5578">Только для взрослых</span>
<h1 style="margin: 0; font-size: 30px; font-weight: 900">Решите пример</h1>
<p style="margin: 0; font-size: 17px; color: #4A5578">Так мы проверяем, что настройки открывает взрослый.</p>
</div>
<form onSubmit="{{gate.submit}}" style="display: flex; flex-direction: column; gap: 14px">
<label for="um-gate" aria-label="{{gate.qAria}}" style="font-size: 40px; font-weight: 900; text-align: center; font-variant-numeric: tabular-nums">{{gate.q}}</label>
<input id="um-gate" class="um-input" type="text" inputMode="numeric" autoComplete="off" maxLength="3" value="{{gate.ans}}" onChange="{{gate.onAns}}" style="min-height: 60px; padding: 0 16px; border-radius: 16px; border: 2px solid #C9D3EE; background: #FFFFFF; color: #1E2A4A; font-size: 28px; font-weight: 900; text-align: center; font-family: inherit; box-sizing: border-box; width: 100%">
<sc-if value="{{gate.hasErr}}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 0; padding: 12px 14px; border-radius: 14px; background: #FEECEB; color: #A11A12; font-size: 16px; font-weight: 800">{{gate.err}}</p>
</sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="submit" class="press" style="flex: 1 1 200px; min-height: 56px; border-radius: 999px; border: 0; background: #1E2A4A; color: #FFFFFF; font-size: 19px; font-weight: 900; cursor: pointer">Продолжить</button>
<button type="button" class="press" onClick="{{gate.back}}" style="flex: 0 1 140px; min-height: 56px; border-radius: 999px; border: 2px solid #1E2A4A; background: #FFFFFF; color: #1E2A4A; font-size: 18px; font-weight: 800; cursor: pointer">Назад</button>
</div>
</form>
</section>
</main>
</sc-if>

<sc-if value="{{isParents}}" hint-placeholder-val="{{ false }}">
<main style="max-width: 860px; margin: 0 auto; padding: 4px 16px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<section style="background: #1E2A4A; color: #FFFFFF; border-radius: 32px; padding: 28px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: #C9D3EE">Раздел для взрослых</span>
<h1 style="margin: 0; font-size: 34px; font-weight: 900">Как устроены занятия</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.5; color: #E3E9F8">Игры подстраиваются под выбранный возраст. Для каждого возраста свой набор игр: малышам 3–4 лет 9 игр без цифр и чтения, детям 5–6 лет 13 игр с первыми буквами. Примерно через 15 минут игры сайт предлагает перерыв для глаз на 40 секунд. В каждой игре 50 уроков, они открываются по очереди, а задания постепенно усложняются. В «Цветах», «Предметах», «Буквах», «Первой букве» и «Посчитай» урок начинается со знакомства: ребёнку показывают и называют новое («Это зелёный цвет»), а потом он закрепляет это в 5 заданиях. В «Найди пару» — 3 раунда. Чем меньше ошибок, тем больше звёзд: от одной до трёх.</p>
</section>
<section style="background: #FFFFFF; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 24px; font-weight: 900">Что тренируем</h2>
<sc-for list="{{ageInfo}}" as="ai" hint-placeholder-count="3">
<div style="display: flex; gap: 14px; align-items: flex-start">
<span style="flex: none; min-width: 72px; padding: 8px 10px; box-sizing: border-box; border-radius: 14px; background: #EEF3FF; font-size: 18px; font-weight: 900; text-align: center">{{ai.label}}</span>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #33405F; padding-top: 6px">{{ai.text}}</p>
</div>
</sc-for>
</section>
<section style="background: #FFFFFF; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 24px; font-weight: 900">Данные и звук</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #33405F">Играть можно без входа. Если создать аккаунт родителя (кнопка «Войти» вверху), внутри него появятся профили детей, у каждого свои звёзды и уроки. Звёзды, собранные без входа, перейдут в первый созданный профиль. Добавлять и менять профили можно только после примера «для взрослых».</p>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #33405F">Сейчас вход работает в демо-режиме: аккаунт, профили, возраст, уроки, звёзды и настройка звука хранятся только в этом браузере на этом устройстве и никуда не отправляются, пароль не сохраняется. Если браузер не разрешает сохранять данные (например, в приватном режиме), игры работают, но звёзды пропадут после закрытия страницы.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #33405F">Звуки короткие и включаются только после нажатия. Кнопка «Звук» вверху выключает их совсем; для 3–4 лет задание звучит само, для 5–6 лет — по кнопке с динамиком рядом с заданием. Задания озвучены записанным голосом (озвучка создана в сервисе elevenlabs.io). После ответа малышей голосом хвалят или подбадривают. Если звук выключен, вместо голоса появляется подсказка-картинка.</p>
</section>
<section style="background: #FFFFFF; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 24px; font-weight: 900">Сбросить прогресс</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #33405F">Сотрёт все звёзды и пройденные уроки того, кто сейчас играет. Выбранный возраст и другие профили останутся.</p>
<sc-if value="{{showResetAsk}}" hint-placeholder-val="{{ true }}">
<div><button type="button" class="press" onClick="{{resetAsk}}" style="min-height: 52px; padding: 0 22px; border-radius: 999px; border: 2px solid #B4470F; background: #FFFFFF; color: #B4470F; font-size: 18px; font-weight: 900; cursor: pointer">Сбросить звёзды</button></div>
</sc-if>
<sc-if value="{{confirmReset}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px; border-radius: 20px; background: #FFF1E8">
<span style="font-size: 18px; font-weight: 900; color: #7A3208">Точно стереть все звёзды?</span>
<button type="button" class="press" onClick="{{resetDo}}" style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: 0; background: #B4470F; color: #FFFFFF; font-size: 17px; font-weight: 900; cursor: pointer">Да, стереть</button>
<button type="button" class="press" onClick="{{resetCancel}}" style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: 2px solid #1E2A4A; background: #FFFFFF; color: #1E2A4A; font-size: 17px; font-weight: 800; cursor: pointer">Отмена</button>
</div>
</sc-if>
<sc-if value="{{resetDone}}" hint-placeholder-val="{{ false }}">
<p role="status" style="margin: 0; font-size: 17px; font-weight: 800; color: #14713D">Готово: звёзды сброшены.</p>
</sc-if>
</section>
</main>
</sc-if>
<sc-if value="{{showFooter}}" hint-placeholder-val="{{ true }}">
<footer style="margin-top: 56px">
<div aria-hidden="true" style="position: relative; height: 180px; overflow: hidden">
<svg viewBox="0 0 1440 200" preserveAspectRatio="none" style="position: absolute; left: 0; bottom: 0; display: block; width: 100%; height: 150px"><path d="M0 120 C 240 40, 480 40, 720 110 C 960 180, 1200 60, 1440 90 L1440 200 L0 200 Z" fill="#D3F1E3"></path><path d="M0 150 C 300 90, 560 110, 820 150 C 1080 190, 1260 120, 1440 140 L1440 200 L0 200 Z" fill="#B9E8D2"></path></svg>
<div class="um-plants" style="position: absolute; inset: 0">
<sc-for list="{{plants}}" as="pl" hint-placeholder-count="0">
<span class="um-pk {{pl.pop}}" style="left: {{pl.x}}%; bottom: {{pl.b}}px; width: {{pl.w}}px; height: {{pl.w}}px">
<span class="um-dm um-dsway" style="animation-duration: {{pl.dur}}s; animation-delay: -{{pl.delay}}s">
<sc-if value="{{pl.is_tree}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 64 64" style="display: block; width: 100%; height: 100%; overflow: visible"><rect x="28" y="36" width="8" height="26" rx="3" fill="url(#umg-wood)"></rect><circle cx="20" cy="32" r="12" fill="url(#umg-green)"></circle><circle cx="44" cy="32" r="12" fill="url(#umg-green)"></circle><circle cx="32" cy="22" r="18" fill="url(#umg-green)"></circle><circle cx="25" cy="15" r="4" fill="#FFFFFF" opacity=".35"></circle><circle cx="39" cy="28" r="3.2" fill="#EF4444"></circle><circle cx="23" cy="33" r="3.2" fill="#EF4444"></circle><circle cx="33" cy="12" r="3.2" fill="#EF4444"></circle></svg></sc-if>
<sc-if value="{{pl.is_daisy}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 64 64" style="display: block; width: 100%; height: 100%; overflow: visible"><path d="M32 32 V62" stroke="#2E9E5B" stroke-width="4" stroke-linecap="round"></path><ellipse cx="40" cy="52" rx="8" ry="3.5" fill="#43B86E" transform="rotate(-30 40 52)"></ellipse><ellipse cx="32" cy="12" rx="5.5" ry="9" fill="#FFFFFF" stroke="#FFD1E8" stroke-width="1.5" transform="rotate(0 32 22)"></ellipse><ellipse cx="32" cy="12" rx="5.5" ry="9" fill="#FFFFFF" stroke="#FFD1E8" stroke-width="1.5" transform="rotate(45 32 22)"></ellipse><ellipse cx="32" cy="12" rx="5.5" ry="9" fill="#FFFFFF" stroke="#FFD1E8" stroke-width="1.5" transform="rotate(90 32 22)"></ellipse><ellipse cx="32" cy="12" rx="5.5" ry="9" fill="#FFFFFF" stroke="#FFD1E8" stroke-width="1.5" transform="rotate(135 32 22)"></ellipse><ellipse cx="32" cy="12" rx="5.5" ry="9" fill="#FFFFFF" stroke="#FFD1E8" stroke-width="1.5" transform="rotate(180 32 22)"></ellipse><ellipse cx="32" cy="12" rx="5.5" ry="9" fill="#FFFFFF" stroke="#FFD1E8" stroke-width="1.5" transform="rotate(225 32 22)"></ellipse><ellipse cx="32" cy="12" rx="5.5" ry="9" fill="#FFFFFF" stroke="#FFD1E8" stroke-width="1.5" transform="rotate(270 32 22)"></ellipse><ellipse cx="32" cy="12" rx="5.5" ry="9" fill="#FFFFFF" stroke="#FFD1E8" stroke-width="1.5" transform="rotate(315 32 22)"></ellipse><circle cx="32" cy="22" r="6.5" fill="url(#umg-yellow)"></circle></svg></sc-if>
<sc-if value="{{pl.is_tulip}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 64 64" style="display: block; width: 100%; height: 100%; overflow: visible"><path d="M32 34 V62" stroke="#2E9E5B" stroke-width="4" stroke-linecap="round"></path><path d="M32 58 Q18 52 16 38 Q28 44 32 54 Z" fill="#43B86E"></path><path d="M32 58 Q46 52 48 40 Q36 46 32 54 Z" fill="#36A35F"></path><path d="M18 12 Q18 34 32 36 Q46 34 46 12 L39 19 L32 9 L25 19 Z" fill="url(#umg-pink)"></path><ellipse cx="25" cy="22" rx="2.5" ry="6" fill="#FFFFFF" opacity=".45"></ellipse></svg></sc-if>
</span>
</span>
</sc-for>
</div>
<svg viewBox="0 0 1440 200" preserveAspectRatio="none" style="position: absolute; left: 0; bottom: 0; display: block; width: 100%; height: 150px"><path d="M0 178 C 360 140, 720 205, 1080 172 C 1260 158, 1360 170, 1440 174 L1440 200 L0 200 Z" fill="#A3DEC3"></path></svg>
</div>
